actly what was reviewed, inside withMirrorSuppressed()", "files": ["store/proposal-estimator-store.ts"]}, {"n": 5, "from": "s-project", "to": "st-tasks", "action": "The other direction: a manager renames a seeded task or changes its hours", "files": ["components/features/tasks/TaskDetailDrawer.tsx"]}, {"n": 6, "from": "st-tasks", "to": "l-sync", "action": "mirrorTaskChange() -> applyTaskToLineItems(): hours go back through base_hours", "files": ["store/tasks-store.ts:797", "lib/sync/estimate-project-sync.ts"]}, {"n": 7, "from": "l-sync", "to": "t-proposals", "action": "Line item updated + persisted; the toast names the Zoho deal still holding the old figures", "files": ["store/proposal-estimator-store.ts"]}, {"n": 8, "from": "s-proposals", "to": "x-zoho", "action": "Send to Zoho re-prices the deal (Packages rows). PBS drift is only SHOWN — no update endpoint exists", "files": ["components/features/proposals/ZohoSendDialog.tsx"]}]}, {"id": "f-pbs-po", "name": "Deal won → purchase order in PBS", "actor": "Admin / Manager", "summary": "Billing waits for the win. Sales moves the deal to a won stage in Zoho; the app notices by polling, promotes the estimate to approved, and only then offers Create PO.", "steps": [{"n": 1, "from": "x-zoho", "to": "s-proposals", "action": "Sales moves the deal to Closed Won; useZohoStageRefresh notices on the next open", "files": ["hooks/useZohoStageRefresh.ts"]}, {"n": 2, "from": "s-proposals", "to": "b-wontransition", "action": "applyWonTransition(): promote draft/sent -> approved, log activity, notify admins+managers", "files": ["lib/zoho/won-transition.ts"]}, {"n": 3, "from": "s-proposals", "to": "api-pbs", "action": "Create PO dialog: billing client, template, name, project start/end dates", "files": ["components/features/proposals/CreatePoDialog.tsx"]}, {"n": 4, "from": "api-pbs", "to": "x-zoho", "action": "Re-read the deal's stage LIVE and fail closed if it cannot be read", "files": ["app/api/pbs/pos/route.ts"]}, {"n": 5, "from": "api-pbs", "to": "x-pbs", "action": "409 if a candidate PO already exists; otherwise create-po (client's own template)", "files": ["lib/pbs/clients.ts", "lib/pbs/directory.ts"]}, {"n": 6, "from": "api-pbs", "to": "t-proposals", "action": "Record proposals.pbs {po_id, po_no, client, start_date, end_date}", "files": ["store/proposal-estimator-store.ts"]}]}, {"id": "f-onboarding", "name": "Newcomer onboarding", "actor": "Any role", "summary": "Someone who accepted their invite after TOURS_LAUNCHED_AT lands on the dashboard: welcome dialog -> welcome tour -> Getting started checklist -> Show me -> page tours. Existing users get one hint and the ? menu only.", "steps": [{"n": 1, "from": "st-team", "to": "c-tours", "action": "useIsNewUser(): profiles.confirmed_at >= TOURS_LAUNCHED_AT (null = bootstrap admin = existing)", "files": ["components/features/tour/use-tours.ts"]}, {"n": 2, "from": "c-tours", "to": "st-tours", "action": "Welcome dialog on /dashboard until answered; Start / Later (session) / Don't show again", "files": ["components/features/tour/TourHost.tsx"]}, {"n": 3, "from": "c-tours", "to": "t-tour-progress", "action": "runTour() -> driver.js; any exit records completed (last step seen) or dismissed", "files": ["lib/tours/run.ts", "store/tour-store.ts"]}, {"n": 4, "from": "s-dashboard", "to": "c-checklist", "action": "checklistItems(): items derived from stores; N/A never blocks 100%", "files": ["lib/tours/checklist.ts", "components/features/tour/GettingStartedCard.tsx"]}, {"n": 5, "from": "c-checklist", "to": "c-tours", "action": "Show me: setPending({tourId,target}) + navigate; TourHost starts the tour at that step once the page renders", "files": ["components/features/tour/TourHost.tsx"]}]}], "invariants": ["RLS is the authoritative authorization wall (0002_rls.sql +); usePermissions() is a UX mirror only — keep the two in lockstep.", "isSupabaseConfigured is the single demo/live switch. No env -> Zustand + localStorage demo with DUMMY_* seeds. Live -> stores start empty + loading, hydrate via WorkspaceSync; localStorage persists EMPTY (partialize) so Supabase stays the source of truth.", "Live writes are optimistic write-through + structuredClone snapshot rollback; demo writes use a one-shot Undo toast (not a stack).", "Live IDs are crypto.randomUUID() generated client-side up front — no temp->real swap.", "Realtime publishes only 8 tables: notifications, activity, projects, sprints, tasks, task_assignees, task_comments, comment_reactions. proposals / time_entries / member_skills / availability_entries / weekly_capacity / profiles / allowed_emails hydrate on load only.", "Guided estimates ship with add-ons OFF (phases already itemize design/QA/PM) to avoid double counting; risk / timeline / Min-Mid-Max are derived by analyzeDiscovery on the fly, never stored.", "Line math: base_hours × tier (basic 1 / advanced 1.5 / custom 2) × qty. Roll-up add-ons compound: responsive -> design -> qa -> pm. requirements_unclear forces every line to Advanced.", "Time logging is server-enforced: only an accepted assignee (or admin) can log hours (time_entries insert RLS + tasks_guard_hours trigger). Managers/coordinators cannot log hours.", "Invites are single-use GET links; email SafeLinks scanners can burn them, so /auth/confirm verifies the OTP only on button click and /api/invites self-heals a burned invite (delete unconfirmed + resend).", "Privileged ops (invite, ban/unban, hard-delete) never run in the browser — only via 3 service-role API routes behind requireAdmin().", "Hard delete anonymizes: owner/reporter/author FKs are ON DELETE SET NULL ('Former member', 0020). Deactivate is a reversible ban + deactivated_at flag.", "page_access is a per-user href allowlist, orthogonal to role, guarded against self-grant (0027). PageAccessGuard only gates paths present in dashboard-nav-config (gateableNavItems) — a route missing from that list is reachable by any authenticated user.", "Next 16: the root middleware file is proxy.ts (renamed from middleware.ts).", "TanStack Query is installed but NOT wired (no QueryClientProvider) — the synced-store bridge covers caching. There is no lib/api and no axios; supabase-js replaces that layer.", "Esther (AI chat): store + EstherClient exist but the /esther route is coming-soon / unwired.", "Email is Supabase built-in GoTrue only — no Postmark/Resend/SendGrid/SMTP dependency anywhere.", "A project's timeline IS its sprints — there is no separate timeline table. convertToProject scaffolds one sprint per estimate phase and slots each seeded task in (join key: phaseLabelForLineItem <-> PHASE_META[id].label; unmatched -> backlog). GanttClient renders it, and `lockedProjectId` embeds it on the project page.", "convertToProject / regenerateSchedule must insert sprints BEFORE tasks (task.sprint_id FK) AND optimistically upsert both into the stores — a realtime echo is not guaranteed to arrive before the user navigates. Skipping the optimistic upsert caused the 'converted project looks empty' bug.", "The assignment engine never assigns a task to a dev lacking the matched skill. skillTiers() returns tiers best-first and the FIRST tier with an eligible dev wins, so specialists beat generalists. Phases with no dev-skill mapping (design/discovery/content/SEO) stay unassigned but still reserve time. Only confirmed+active profiles WITH skills are eligible — an unseeded workspace assigns everything to the one skilled user.", "zoho_connection (0028) has RLS ENABLED WITH NO POLICIES on purpose: only the service-role key may read/write it. Verified — anon SELECT returns 0 rows, INSERT 401, UPDATE/DELETE report 204 but match 0 rows. Zoho tokens must never reach the browser; /api/zoho/status returns metadata only.", "Zoho scopes are frozen into the token at consent time (currently READ-only: modules/users/org/settings). Widening them requires editing ZOHO_SCOPES, redeploying, AND a Disconnect -> Connect re-consent — an existing refresh token cannot gain scope.", "Zoho API quirks that cost time: search `criteria` supports only equals/starts_with (`contains` -> 400 INVALID_QUERY), so single-box search uses `word=` (Accounts, Contacts and Deals all); record counts need v2.1+ (`/actions/count` 400s on v2); the callback must use the `accounts-server` query param, not a hardcoded DC; bulk read needs a separate ZohoCRM.bulk.READ scope.", "proposals.zoho (0029) is written through TWO whitelists — `quoteUpdatePayload()` and the `Pick<ClientQuote,…>` param type of `updateProposal`. Miss either and the edit updates the store but silently never persists. Same trap applies to any future column on proposals.", "CRM client data comes from Accounts (companies, ~4.0k) + Contacts (people, ~3.7k), NOT Leads (~122k raw/unqualified, full of test+spam rows). A Lead converts into Account+Contact(+Deal); the qualified records are the ones worth showing. An account can have many contacts, so the picker is two-step.", "Zoho write-back writes ONLY Deal.Stage. Amount is a formula field and Quote_number a system autonumber on this org — both accept a write, report SUCCESS, then keep/restore their computed value. Never re-add them to the push payload without re-testing against a real Deal.", "Zoho does NOT dedupe attachments — the same filename uploaded twice creates two records. The guard is proposals.zoho.pushes (stage -> timestamp), checked and written SERVER-side; it is per-stage so a deal can advance more than once, but no single stage can be pushed twice. Read it via zohoPushes(), which folds in the legacy pushed_at/pushed_stage fields.", "Zoho stages the app may set are whitelisted in lib/zoho/push-state.ts (Proposal Sent, Project Completed). Closed Won / Closed Lost are deliberately excluded: \"approved\" here means the team agreed to start work, not that a client signed, so revenue stages stay a human sales decision.", "The app never CREATES Zoho deals, by choice. Every money field on Deals in this org is formula-driven (Amount, Deal_Amount, Total, Deposit* — all verified unsettable), so an app-created deal would sit in the pipeline permanently at $0 and owned by the OAuth identity. Quotes made by hand attach an EXISTING deal instead (\"Link a Zoho deal\").", "tasks.source_line_item_id is the ONLY link between a task and its estimate line item (0032/0033). It is a client-generated text id, not a uuid. NULL = made by hand, and no sync may rename, re-hour or delete it.", "Estimate -> project is previewed then confirmed; project -> estimate is immediate. The estimate->project half runs inside withMirrorSuppressed() so it cannot echo back through the registry.", "A task's new estimated_hours is written back through the line item's base_hours, never onto its derived `hours` — otherwise the next recompute silently undoes it. The inversion must honour `requirements_unclear`, which prices every line as Advanced.", "proposals has no realtime channel, on purpose: the row is one JSONB document, so an echoed upsert would replace line_items / addons / discovery under someone mid-edit.", "persistQuoteDoc sends the WHOLE quote document, so any two concurrent writes race and the wider one wins. Anything changing two fields at once must go through a single action (applyDealStage).", "Zoho's Amount is recomputed from the Packages subform within seconds, so a price only reaches the CRM as a priced Packages row — never as an Amount write.", "PBS has no update and no delete endpoint for a purchase order. A schedule that moves after the PO is raised can only be REPORTED (poScheduleDrift) and corrected in PBS by hand.", "PBS token minting is not safe to race (unique index on app_id + refresh_token_hash); every caller shares one in-flight promise and re-reads the cache on failure.", "A stage push records where the deal SETTLED, not what was requested — a push can be held back, and persisting the request is how the badge started lying once before.", "A PBS purchase order is billed against a date range PBS itself will never let this app change, so a sprint date edit must SAY SO when it happens (notifyProjectScheduleChanged), deduped on the resulting range — the persistent badge alone is in the one place nobody looks while rescheduling.", "A sync never deletes a task with logged hours — time_entries.task_id is `on delete cascade` (0017), so it would erase the record that the work happened, and per-person hours come from that table alone. It is reported as `orphaned` and kept.", "The project→estimate mirror is revertible: the task write it follows is optimistic, so every rollback path (live update failure, live delete failure, both demo Undo toasts) must undo the estimate write too, or a refused request silently reprices or drops a line item on a client quote.", "A dev finishes work by moving the task to `done` — the only signal. There is no per-assignee completion flag and logging hours completes nothing. isOpen() (lib/workload/assigned-work.ts) is the single definition of open, and in_review/blocked still count.", "Both workload views compute from lib/workload/assigned-work.ts. Rolling a second definition is how Mine and Team came to show the same person different numbers — one counting pending assignments and time off, the other neither.", "commitTaskMove persists the destination column scoped by status + project_id + sprint_id. Status alone swept in every task in the workspace sharing it, bumping updated_at on rows nobody touched — and that timestamp is read as a completion time.", "Only an APPROVED availability entry reduces capacity or steers scheduling. countsAgainstCapacity() guards this inside awayWorkdaysInWeek and ptoDaysByProfile, not at the call sites, so no consumer can forget. A missing status means the row predates 0034.", "`NULL in (...)` is NULL, not false. 0034's approval guard read `current_user_role() in ('admin','manager')`, which is NULL for the service-role key, so `if not approver` was `not NULL` and both guards were skipped — verified live. Any role check in a trigger must be coalesce(..., false) so it fails closed.", "The calendar is role-scoped: Member/Viewer see only their own tasks, their projects' sprints and their own leave. RLS (0034) narrows the data to match, so hiding it in the UI is a promise, not the enforcement.", "An 'Approve + reschedule' writes reschedulePatches(impact) — the same object the dialog rendered. Recomputing at write time is how a preview and its result come to disagree.", "The tentative timeline's PTO model is TEAM-level (a day at 60% staffing yields 0.6 of a working day) because it is computed before anyone is assigned. Per-person leave is planSchedule's job, via ptoDays.", "addWorkingDays delegates to addBusinessDays when there is no calendar — identical, not merely equivalent — and buildTeamCalendar returns null for an empty roster, so an un-hydrated team store cannot stretch or collapse a timeline.", "`confirmed_at` on a team member is OPTIONAL: test it for truthiness, never `!== null`. An unaccepted invite carries undefined and would be counted as roster capacity it cannot supply.", "US holidays apply with NO team calendar - an empty roster still does not work on Christmas - so addWorkingDays cannot short-circuit to addBusinessDays. It stays byte-identical over a holiday-free window.", "A holiday is not PTO. awayWorkdaysInWeek skips holiday days and holidayWorkdaysInWeek counts them, or a week off over Thanksgiving would cost six days out of five and drive capacity negative. Both are reported separately because a manager can decline leave and cannot decline Christmas.", "The federal observance rule (Sat -> Fri before, Sun -> Mon after) applies to the FIXED-date holidays, and New Year's Day can land in the previous December - range lookups must scan a year either side.", "risk_buffer_pct stretches dates ONLY. Hours and price are untouched - repricing for risk is requirements_unclear. regenerateLineItems must never receive the buffer.", "The buffer scales every timeline offset including STARTS, so the plan stays continuous; buffering only the ends would overlap each phase with the next.", "Applying a buffer to real sprint dates goes through a preview+confirm and then resets the buffer to 0 - it is part of the dates now, and applying 20% twice is 44%.", "The Gantt must convert offsets to dates with addWorkingDays, the SAME function computeTimeline uses for the phase labels. addBusinessDays there drifted the month dividers away from the bars on any plan crossing a holiday.", "Any date this app HANDS SOMEONE (a due date, a sprint end, a PO range) goes through addWorkingDays, never addBusinessDays - the latter only avoids weekends and will happily land a deadline on Christmas.", "A batch of sprint writes fires one schedule notice, not one per sprint: wrap the loop in withMirrorSuppressed and call notifyProjectScheduleChanged once, or the drift dedupe key changes underneath and a single action stacks warnings.", "The workload bar is segmented by task status and shared by both views. Over-capacity is an amber ring, never a recolour of the fill - the limit and what the load is made of are different signals.", "Workload \"Available\" = effective weekly capacity minus hours LOGGED this week. It is not spare capacity: with an unbounded backlog someone can have hours left in the week and still be over-allocated, which is what utilisation reports.", "A count badge must be able to show WHAT it counted. Pending/overdue open a popover listing the tasks, each linking to its board, and the list is derived from the same array the count is - a badge that disagrees with its own list is worse than no list.", "e2e fixture names must be unique per run, not merely [E2E]-prefixed. The suite is serial but the three viewport projects run the same tests against one shared database, so a fixed name is created and deleted three times over - any test that finds its fixture BY TEXT breaks on a lingering duplicate. Tests that use the returned row id are unaffected.", "postgres_changes bindings are RLS-checked SERVER-SIDE AT JOIN TIME, against the token the SOCKET carries - not the one REST calls use. Join before the cookie session resolves and the bindings register as anon, match nothing, and stay dead for the life of the channel; handing the socket a token afterwards does not re-evaluate them. It fails silently - the channel reports SUBSCRIBED, the socket token reads authenticated a moment later, Broadcast still works and the replication slots stay caught up. Hence liveChannels(), which awaits realtime.setAuth() before .subscribe(). setAuth takes NO argument: an explicit token is marked manually-set and permanently disables supabase-js's own hourly refresh.", "On a realtime DELETE, payload.old carries ONLY the primary key (REPLICA IDENTITY DEFAULT), so an applier reading any non-PK column from it silently no-ops. Audited: weekly_capacity PK is profile_id, task_assignees (task_id, profile_id), comment_reactions (comment_id, profile_id, emoji), the rest id - each exactly what its handler reads. Check this before publishing a new table; a surrogate id PK on a join table breaks DELETE propagation while INSERT and UPDATE keep working.", "An auto-approved time-off row (admin/manager booking their own) still records reviewed_by = that person and reviewed_at, and both are sent WITH the insert. Null made it indistinguishable from pre-0034 grandfathered rows; client-side-only would have the store claim a reviewer Postgres never stored. 0035's trigger nulls these for a non-approver only.", "The dashboard derives no numbers of its own: both scopes read lib/workload/assigned-work.ts (assignedWork / capacityFor / utilization / statusBreakdown), the same calls Workload makes, and hooks/useWeekLoggedHours.ts for logged hours (time_entries, never tasks.logged_hours). It is the page people quote at each other, so it must agree with every other page; e2e/dashboard-views.spec.ts asserts every 'N% of Mh' it prints also appears on Workload.", "TASK_STATUS_META holds dot (Tailwind class) and hex (for SVG/recharts) on one line per status, because SVG cannot take a Tailwind class and the two drifting is how a status ends up one colour on the board and another in a chart. Chart colours must come from it, never from the chart library's own palette. TASK_STATUS_LABEL lives there too - the dashboard and Reports each had a private copy.", "Per-person task counts credit a shared task to each assignee; workspace-wide counts credit it once. Different questions - 'how loaded is this person' vs 'how much work is there' - and a 6h task with two assignees is 6h of work, not 12h. Applies to Workload's totalOpenEst and the dashboard's workspaceMix alike.", "useWeekLoggedHours returns null until the time_entries read resolves (and always in demo mode), never {}: 'nobody logged anything' and 'not loaded yet' are both 0 otherwise, and the personal card shows an em dash plus full remaining capacity for the second. Callers use weekLogged?.[id] ?? 0. Reports keeps its own time_entries read on purpose - no date filter, because it answers an all-time question.", "An empty state over async data must be gated on the store's `loaded` flag. members is [] while the team store hydrates, so an ungated empty state tells an admin with a full team that they have no team. Dashboard Team and Workload render a skeleton until loaded, then choose between content and empty.", "A sprint may start and end on the same day: both sprint modals validate end >= start. The estimate scaffolder inserts sprints directly and never sees that schema, so it already produces one-day sprints; a strict > made them unsavable from the Edit modal. A rule enforced by only one of two writers of the same table will drift.", "main is itself overflow-x:auto, so a layout check asking 'is this inside any scroller?' skips the whole page and passes by doing nothing - how e2e/layout-integrity.spec.ts first shipped inert. Ask WHICH scroller: overflowing main is the bug, overflowing a deliberate inner one (Gantt, wide table, stage-board strip) is the design. Give any new layout assertion a negative control before trusting it.", "The UI is not a security boundary: the anon key is public, so any signed-in user can call PostgREST directly. RLS + triggers are the only gates. scripts/security-probe.mjs attacks with a real throwaway [E2E] member JWT and must print all PASS after any policy/trigger/constraint change.", "prevent_self_approval (0041): a non-approver may withdraw a leave to pending but never decide it; changing the dates/kind of a decided leave re-opens it as pending server-side; verdict fields (reviewed_by/at, review_note) cannot be written by a non-approver. 0035 had it backwards - it refused the client's honest re-pend and allowed a silent date extension of approved leave.", "prevent_role_self_change guards role, page_access, deactivated_at, confirmed_at and email for non-admins. confirmed_at is what puts a person on the roster and into every capacity figure; it is written only by the auth confirmation trigger (NULL role, so the guard lets it through).", "notifications.href and activity.href carry CHECK constraints: internal paths only (one leading '/', no '//', no backslash - browsers normalise '/\\x' to '//x').", "Probe pitfalls: return=representation turns INSERT into INSERT...RETURNING, which then needs SELECT visibility, so a notification to someone else reports an RLS violation and href probes pass falsely; and the service key cannot approve leave (0035 fails closed on a NULL role), so approval fixtures must use an approver JWT.", "Dashboard workspace figures (Open tasks, status mix, Overdue) come from ALL open tasks counted once - assigned or not - so they match Reports; per-person rows stay per-person. KPI values render an em dash until their store has loaded, never a false 0.", "requirements_unclear must be shown wherever it changes a number: Scope & risk, the Line items bar and the Adjust checkbox all state 'own tiers -> priced as Advanced' using quoteDevHours with the flag forced off/on. Worded 'priced as Advanced', never 'x 1.5' (a Custom 2x line goes down). Sentences containing numbers are built as one template-string expression - JSX drops whitespace beside an expression wherever the formatter wraps.", "Hourly rates are data (hourly_rates, 0042). Every estimate line SNAPSHOTS its role+level rate when added (withPricing), so a rate edit never reprices an existing quote; 'Update to current rates' on the Adjust tab re-prices only after an old->new preview and writes the object it rendered. Level 2 >= Level 1 is validated across the table on save; updated_by/updated_at are trigger-stamped (probe P13).", "Catalog v3 is built, never hand-edited: node scripts/build-catalog.mjs (workbook -> catalog.json; normalises dashes, renumbers duplicate ids, refuses unknown role/level/category) then node scripts/remap-catalog-categories.mjs --apply. v3 re-classified tasks between categories, so existing lines are remapped through their own catalog_id - an old->new id table by name is wrong.", "Never compare a catalog category against a literal id; use categoryIdByName(). Ids were renumbered in v3 (old 5 = E-Commerce, new 5 = Custom Tools) and Esther's hardcoded 5 would have misread briefs.", "A line with no rate prices at LEGACY_HOURLY_RATE ($100) - what every line cost before Phase 3 - so legacy quotes are identical with or without snapshots. Lines round to whole dollars and the total is their sum; Zoho Packages rows use splitAmount so they sum to the header. Client PDF/preview/Excel show prices, never rates.", "Work keys (profiles.work_keys, 0043) are admin-set only (prevent_role_self_change; probes P14-P16). Keys govern per discipline: once anyone holds an IT key, only qualifying IT key holders get IT work (Level 2 covers Level 1, never the reverse) and skill stars break ties; a discipline with no keys keeps the skill-only planner byte-identical. A task's role is read from its estimate line via source_line_item_id - no copy on tasks.", "A line's delivery phase is its guided phase label, else its ROLE's (Phase 5: Creative->Design, QA Tester->QA, Project Coordinator->Content, Project Manager->Discovery, IT/none->Development). resultFromQuote builds catalog timelines from the same rule; IT-only quotes are byte-identical to before. Every placement/tag/plan call in one operation takes the same phaseSetOf(scaffold) set, and a role phase the schedule lacks falls back to Development, so nothing lands in the backlog. A re-sync never moves an existing task between sprints.", "Onboarding tours never write: they explain Send to Zoho / Create PO / Approve etc. but the runner blocks clicks on the highlighted element (disableActiveInteraction) and swallows page keyboard shortcuts (the board's 'n') while open. e2e/tours.spec.ts fails on any non-GET except tour_progress during a tour.", "Tour steps anchor on data-tour ids from lib/tours/ids.ts only (tourAnchor()). Renaming one is a type error; e2e/tours.spec.ts fails on any data-tour value not in TOUR_TARGETS (with a negative control). Tour copy restates feature behaviour: change it in the same commit as the feature and bump the tour's version.", "A tour's end is handled in onDestroyStarted, never driver.js's onDestroyed: driver.js skips onDestroyed when its active element is not set yet (Done clicked within a few frames), which left tours unrecorded and the ? button disabled.", "The Getting started checklist derives every item from real data and stores only its dismissal. 'Create your first estimate' reads proposals.owner_id (mapped read-only in rowToQuote, never sent by quoteUpdatePayload).", "Section help (the ? top-right of every page header and main section) is SectionHelp (a Popover, so it opens on touch). Copy: components/common/app-help.tsx (pages) and components/features/proposals/estimator-help.tsx (Estimator). It restates behaviour: update it in the same commit. Every space beside <strong>/<em> is an explicit {\" \"} (the compiler drops it next to an &apos;); e2e/estimator-help.spec.ts checks source and rendered text.", "Invites: email security scanners (SafeLinks) spend Supabase's default /auth/v1/verify links, confirming the account without a password. Admins recover anyone via a password setup link (lib/auth/setup-link.ts: recovery token -> OUR /auth/confirm click-through, scanner-safe) from the invite response, a re-invite, or the key button (POST /api/invites/link). Never for an account with app_metadata.password_set (no signing in as a set-up colleague); never delete a confirmed account to re-invite. /forgot-password is public.", "Start project creates the project with risk_buffer_pct = 0: the scaffolded sprints already carry the estimate's buffer as dates, so copying the percentage would forecast and apply it twice.", "persistQuoteDoc writes updated_at + ONLY the columns the action changed (QuoteColumn[]). A whole-document save reverted zoho/pbs/project_id written meanwhile by a server route, the poll or another tab.", "One estimate per project_id, per pbs.po_no and per ACTIVE zoho.deal_id - partial unique indexes in 0046 back the UI checks.", "DATE columns: read with parseISO, write with format(d,'yyyy-MM-dd'). new Date('2026-10-09') is UTC midnight (a day early west of Greenwich) and toISOString() of local midnight is the day before east of it."], "permissionsMatrix": {"columns": ["Admin", "Manager", "Member", "Viewer"], "rows": [{"cap": "Create / edit project", "v": ["Yes", "Yes", "No", "No"], "rls": "0002_rls.sql:38"}, {"cap": "Delete project", "v": ["Yes", "No", "No", "No"], "rls": "0002_rls.sql:42"}, {"cap": "Create / edit task", "v": ["Yes", "Yes", "Yes", "No"], "rls": "0002_rls.sql:55 / 0027:26"}, {"cap": "Delete task", "v": ["Yes", "Yes", "No", "No"], "rls": "0002_rls.sql:59"}, {"cap": "Manage team (invite/deactivate/delete)", "v": ["Yes", "No", "No", "No"], "rls": "profiles 0002:31 / allowed_emails 0012:21"}, {"cap": "Export proposals + Estimator", "v": ["Yes", "Yes", "No", "No"], "rls": "0002_rls.sql:103"}, {"cap": "Edit others' PTO / availability", "v": ["Yes", "Yes", "No", "No"], "rls": "availability 0002:86 / capacity 0002:92"}, {"cap": "Edit member skills (self always)", "v": ["Yes", "Yes", "self", "self"], "rls": "0026_member_skills.sql:28"}, {"cap": "Log hours (accepted assignee)", "v": ["Yes", "assignee", "assignee", "No"], "rls": "time_entries 0017:27 / tasks_guard_hours 0018"}, {"cap": "View all content", "v": ["Yes", "Yes", "Yes", "Yes"], "rls": "select: auth.role()='authenticated'"}, {"cap": "Connect / disconnect Zoho CRM", "v": ["Yes", "No", "No", "No"], "rls": "app/api/zoho/*: requireAdmin()"}, {"cap": "Search Zoho leads (PII)", "v": ["Yes", "Yes", "No", "No"], "rls": "lib/zoho/guard.ts: requireZohoReader()"}, {"cap": "Push a quote to Zoho (writes CRM)", "v": ["Yes", "Yes", "No", "No"], "rls": "lib/zoho/guard.ts: requireZohoWriter()"}, {"cap": "Read / write own tour progress", "v": ["Yes", "Yes", "Yes", "Yes"], "rls": "0045: tour_progress self-only (profile_id = auth.uid())"}]}};
</script>
<script>
/* ---- viewer ---- */
const COL_W=200, COL_GAP=62, ROW_H=64, CARD_H=48, HEAD_H=34, PAD_L=30, PAD_T=44;
const byId = Object.fromEntries(DATA.nodes.map(n=>[n.id,n]));
const layerById = Object.fromEntries(DATA.layers.map(l=>[l.id,l]));
const pos = {};
const state = { flow:null, node:null, hover:null, search:"", showEdges:true };

/* layout: column per layer, stacked rows */
function layout(){
  DATA.layers.forEach((l,ci)=>{
    const items = DATA.nodes.filter(n=>n.layer===l.id);
    items.forEach((n,ri)=>{
      pos[n.id] = { x: PAD_L + ci*(COL_W+COL_GAP), y: PAD_T + HEAD_H + ri*ROW_H, col:ci };
    });
  });
  const maxRows = Math.max(...DATA.layers.map(l=>DATA.nodes.filter(n=>n.layer===l.id).length));
  const w = PAD_L*2 + DATA.layers.length*COL_W + (DATA.layers.length-1)*COL_GAP;
  const h = PAD_T*2 + HEAD_H + maxRows*ROW_H;
  const c = document.getElementById('canvas');
  c.style.width = w+'px'; c.style.height = h+'px';
  const svg = document.getElementById('svg');
  svg.setAttribute('width',w); svg.setAttribute('height',h); svg.setAttribute('viewBox','0 0 '+w+' '+h);
}

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const esc = s => String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* build header + columns + node cards once */
function build(){
  document.getElementById('h-title').textContent = DATA.meta.title;
  document.getElementById('h-sub').textContent = DATA.meta.subtitle;
  document.getElementById('h-stack').textContent = DATA.meta.stack;
  document.getElementById('h-hint').textContent = 'mode: '+DATA.meta.mappedFrom.replace(/\.$/,'')+' · '+DATA.nodes.length+' nodes · '+DATA.flows.length+' flows';
  const leg = document.getElementById('h-legend');
  DATA.legend.forEach(x=>{ const i=el('div','item'); i.append(dot(x.color), document.createTextNode(x.label)); leg.append(i); });

  const canvas = document.getElementById('canvas');
  DATA.layers.forEach((l,ci)=>{
    const hd = el('div','col-head', esc(l.title.toUpperCase()));
    hd.style.left = (PAD_L + ci*(COL_W+COL_GAP))+'px'; hd.style.top = PAD_T+'px';
    hd.style.width = COL_W+'px'; hd.style.color = l.color; hd.style.opacity='.65';
    canvas.append(hd);
  });
  DATA.nodes.forEach(n=>{
    const p = pos[n.id], l = layerById[n.layer];
    const node = el('div','node');
    node.id = 'node-'+n.id;
    node.style.left=p.x+'px'; node.style.top=p.y+'px'; node.style.width=COL_W+'px';
    node.style.minHeight=CARD_H+'px'; node.style.borderLeftColor=l.color; node.style.color=l.color;
    node.innerHTML = '<div class="nlabel" style="color:var(--text)">'+esc(n.label)+'</div>'+
                     (n.sub?'<div class="nsub">'+esc(n.sub)+'</div>':'');
    if(n.flags){ const f=flagColor(n.flags); if(f){const d=el('span','flagdot');d.style.background=f;node.append(d);} }
    node.addEventListener('click',e=>{e.stopPropagation();selectNode(n.id);});
    node.addEventListener('mouseenter',()=>{ if(!state.flow){ state.hover=n.id; paint(); }});
    node.addEventListener('mouseleave',()=>{ if(state.hover===n.id){ state.hover=null; paint(); }});
    canvas.append(node);
  });

  const fl = document.getElementById('flows');
  DATA.flows.forEach(f=>{
    const d = el('div','flow'); d.id='flow-'+f.id;
    d.innerHTML='<div class="fname">'+esc(f.name)+'</div><div class="factor">'+esc(f.actor)+'</div><div class="fsum">'+esc(f.summary)+'</div>';
    d.addEventListener('click',()=>selectFlow(f.id));
    fl.append(d);
  });

  buildMatrix(); buildInvariants();
  document.getElementById('search').addEventListener('input',e=>{state.search=e.target.value.trim().toLowerCase();paint();});
  document.getElementById('tog-edges').addEventListener('change',e=>{state.showEdges=e.target.checked;paint();});
  document.getElementById('clear').addEventListener('click',()=>{state.flow=null;state.node=null;state.hover=null;renderCtx();paint();syncFlowButtons();});
  document.getElementById('stage').addEventListener('click',()=>{ if(state.node){state.node=null;renderCtx();paint();} });
}
function dot(color){const d=el('span','dot');d.style.background=color;return d;}
function flagColor(f){ if(f.serviceRole)return '#ef4444'; if(f.gated)return '#f5b301'; if(f.modeSwitch)return '#22d3ee'; if(f.planned||f.demoOnly)return '#5f5f68'; if(f.pending)return '#ec4899'; return null; }

/* ---- edge geometry ---- */
function anchors(a,b){
  const A=pos[a], B=pos[b]; const ah=nodeH(a), bh=nodeH(b);
  const ay=A.y+ah/2, by=B.y+bh/2;
  let ax,bx,dir;
  if(B.x>=A.x){ ax=A.x+COL_W; bx=B.x; dir=1; } else { ax=A.x; bx=B.x+COL_W; dir=-1; }
  return {ax,ay,bx,by,dir};
}
function nodeH(id){ const e=document.getElementById('node-'+id); return e?e.offsetHeight:CARD_H; }
function pathFor(a,b){
  const {ax,ay,bx,by,dir}=anchors(a,b);
  const dx=Math.abs(bx-ax); const off=Math.max(38,Math.min(150,dx*0.45))*dir;
  const c1x=ax+off, c2x=bx-off;
  const d='M '+ax+' '+ay+' C '+c1x+' '+ay+' '+c2x+' '+by+' '+bx+' '+by;
  const mx=0.125*ax+0.375*c1x+0.375*c2x+0.125*bx;
  const my=0.125*ay+0.375*ay+0.375*by+0.125*by;
  return {d,mx,my};
}
function line(a,b,cls,color,w,dash){
  const {d}=pathFor(a,b);
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',d); p.setAttribute('fill','none'); p.setAttribute('class',cls);
  p.setAttribute('stroke',color); p.setAttribute('stroke-width',w);
  if(dash)p.setAttribute('stroke-dasharray',dash);
  return p;
}
function numBadge(a,b,n){
  const {mx,my}=pathFor(a,b);
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  const off=(n%2?-1:1)*(n>0?8:0);
  const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('cx',mx);c.setAttribute('cy',my+off);c.setAttribute('r',9);c.setAttribute('fill','#f5b301');
  const t=document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('x',mx);t.setAttribute('y',my+off+3.5);t.setAttribute('text-anchor','middle');
  t.setAttribute('font-size','11');t.setAttribute('font-weight','700');t.setAttribute('font-family','var(--mono)');t.setAttribute('fill','#1a1400');
  t.textContent=n;
  g.append(c,t);return g;
}

/* ---- paint: edges + node classes for current state ---- */
function paint(){
  const svg=document.getElementById('svg'); svg.innerHTML='';
  const activeNodes=new Set(); let flowEdges=[];
  if(state.flow){
    const f=DATA.flows.find(x=>x.id===state.flow);
    f.steps.forEach(s=>{activeNodes.add(s.from);activeNodes.add(s.to);flowEdges.push(s);});
  } else if(state.node){
    activeNodes.add(state.node);
    DATA.edges.forEach(e=>{ if(e.from===state.node)activeNodes.add(e.to); if(e.to===state.node)activeNodes.add(e.from); });
  } else if(state.hover){
    activeNodes.add(state.hover);
    DATA.edges.forEach(e=>{ if(e.from===state.hover)activeNodes.add(e.to); if(e.to===state.hover)activeNodes.add(e.from); });
  }
  // base faint edges
  if(state.showEdges){
    DATA.edges.forEach(e=>{
      const incident = (state.node&&(e.from===state.node||e.to===state.node)) || (state.hover&&!state.flow&&(e.from===state.hover||e.to===state.hover));
      let pth;
      if(state.flow){ pth=line(e.from,e.to,'','#ffffff',1,null); pth.setAttribute('opacity','0.03'); }
      else if(incident){ pth=line(e.from,e.to,'',layerById[byId[e.from].layer].color,1.6,null); }
      else { pth=line(e.from,e.to,'','#ffffff',1,null); pth.setAttribute('opacity','0.055'); }
      svg.append(pth);
    });
  }
  // flow edges + badges on top
  if(state.flow){ flowEdges.forEach(s=>{ svg.append(line(s.from,s.to,'','#f5b301',2.1,null)); }); flowEdges.forEach(s=>{ svg.append(numBadge(s.from,s.to,s.n)); }); }

  // node classes
  const searching = state.search.length>0;
  DATA.nodes.forEach(n=>{
    const e=document.getElementById('node-'+n.id); e.className='node';
    const sMatch = !searching || (n.label+' '+(n.sub||'')+' '+(n.purpose||'')).toLowerCase().includes(state.search);
    if(!sMatch){ e.classList.add('dim'); return; }
    if(state.flow||state.node||state.hover){
      if(activeNodes.has(n.id)){ e.classList.add(state.flow?'active':'hl'); if(n.id===state.node)e.classList.add('sel'); }
      else e.classList.add('dim');
    }
    if(searching && sMatch && !(state.flow||state.node)) e.classList.add('hl');
  });
}

/* ---- selection ---- */
function selectFlow(id){ state.flow=(state.flow===id?null:id); state.node=null; state.hover=null; syncFlowButtons(); renderCtx(); paint();
  if(state.flow) document.getElementById('flow-'+id).scrollIntoView({block:'nearest'}); }
function selectNode(id){ state.node=id; state.flow=null; state.hover=null; syncFlowButtons(); renderCtx(); paint(); }
function syncFlowButtons(){ DATA.flows.forEach(f=>document.getElementById('flow-'+f.id).classList.toggle('on',state.flow===f.id)); }

function renderCtx(){
  const ctx=document.getElementById('ctx');
  if(state.flow){ renderSteps(ctx); }
  else if(state.node){ renderNode(ctx); }
  else { ctx.innerHTML='<h2>Steps / details</h2><div class="dprose" style="color:var(--muted)">Select a flow to trace its numbered path across the diagram, or click any node to see its files, tables and the flows it takes part in.</div>'; }
}
function renderSteps(ctx){
  const f=DATA.flows.find(x=>x.id===state.flow);
  let h='<h2>'+esc(f.name)+'</h2><div class="dprose" style="color:var(--muted);margin-bottom:10px">'+esc(f.summary)+'</div>';
  f.steps.forEach(s=>{
    h+='<div class="step"><div class="badge">'+s.n+'</div><div><div class="path">'+esc(byId[s.from].label)+' <span class="arrow">→</span> '+esc(byId[s.to].label)+'</div>'+
       '<div class="act">'+esc(s.action)+'</div>'+
       (s.files&&s.files.length?'<div class="files">'+s.files.map(x=>'<span class="fref">'+esc(x)+'</span>').join('')+'</div>':'')+
       '</div></div>';
  });
  ctx.innerHTML=h;
}
function renderNode(ctx){
  const n=byId[state.node], l=layerById[n.layer];
  let h='<div class="dtitle">'+esc(n.label)+'</div>'+(n.sub?'<div class="dsub">'+esc(n.sub)+'</div>':'');
  h+='<span class="dlayer" style="color:'+l.color+';background:'+l.color+'1a;border:1px solid '+l.color+'55">'+esc(l.title)+'</span>';
  if(n.purpose) h+='<div class="drow"><div class="k">what it does</div><div class="dprose">'+esc(n.purpose)+'</div></div>';
  if(n.files&&n.files.length) h+='<div class="drow"><div class="k">files</div>'+n.files.map(x=>'<span class="fref">'+esc(x)+'</span>').join('')+'</div>';
  if(n.tables&&n.tables.length) h+='<div class="drow"><div class="k">tables</div>'+n.tables.map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div>';
  if(n.flags){ const fk=Object.entries(n.flags).map(([k,v])=>'<span class="chip">'+esc(k)+(v===true?'':': '+esc(v))+'</span>').join(''); h+='<div class="drow"><div class="k">flags</div>'+fk+'</div>'; }
  if(n.notes) h+='<div class="note">'+esc(n.notes)+'</div>';
  const inFlows=DATA.flows.filter(f=>f.steps.some(s=>s.from===n.id||s.to===n.id));
  if(inFlows.length){ h+='<div class="drow"><div class="k">appears in flows</div>'+inFlows.map(f=>'<span class="flink" data-f="'+f.id+'">→ '+esc(f.name)+'</span>').join('')+'</div>'; }
  ctx.innerHTML=h;
  ctx.querySelectorAll('.flink').forEach(a=>a.addEventListener('click',()=>selectFlow(a.dataset.f)));
}
function buildMatrix(){
  const m=DATA.permissionsMatrix; let h='<table class="mtx"><tr><th style="text-align:left">Capability</th>'+m.columns.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>';
  m.rows.forEach(r=>{ h+='<tr><td class="cap">'+esc(r.cap)+'</td>'+r.v.map(v=>{const c=v==='Yes'?'y':(v==='No'?'n':'p');return '<td class="'+c+'">'+esc(v)+'</td>';}).join('')+'</tr>'; });
  h+='</table>'; document.getElementById('matrix').innerHTML=h;
}
function buildInvariants(){ document.getElementById('invariants').innerHTML=DATA.invariants.map(x=>'<div class="inv">'+esc(x)+'</div>').join(''); }

/* boot */
layout(); build(); renderCtx();
if(DATA.flows.length) selectFlow(DATA.flows[0].id);
let rt; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{paint();},120);});
</script>
</body>
</html>
