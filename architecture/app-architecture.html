<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Timeline Estimator — Architecture & Flows</title>
<style>
  :root{
    --bg:#0b0b0d; --panel:#141417; --panel2:#0f0f12; --border:#26262c;
    --text:#e7e7ea; --muted:#8a8a93; --muted2:#5f5f68; --accent:#f5b301;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;overflow:hidden}
  a{color:inherit}
  .app{display:grid;grid-template-columns:1fr 372px;grid-template-rows:auto 1fr;height:100vh;gap:0}
  header{grid-column:1/3;border-bottom:1px solid var(--border);padding:16px 22px;background:linear-gradient(180deg,#101013,#0b0b0d)}
  header h1{margin:0;font-size:17px;letter-spacing:.2px}
  header p{margin:6px 0 0;color:var(--muted);max-width:1100px;line-height:1.5;font-size:12.5px}
  .stack{margin-top:8px;color:var(--muted2);font-family:var(--mono);font-size:11px;line-height:1.6}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}
  .legend .item{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11.5px}
  .legend .dot{width:10px;height:10px;border-radius:3px;flex:none}
  .toolbar{display:flex;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap}
  .search{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:7px 11px;color:var(--text);font-family:var(--mono);font-size:12px;width:260px}
  .search::placeholder{color:var(--muted2)}
  .toggle{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;cursor:pointer;user-select:none}
  .toggle input{accent-color:var(--accent)}
  .hint{color:var(--muted2);font-size:11.5px}

  /* diagram */
  .stage{position:relative;overflow:auto;background:
     radial-gradient(circle at 1px 1px,rgba(255,255,255,.03) 1px,transparent 0);
     background-size:26px 26px}
  #canvas{position:relative}
  svg.edges{position:absolute;inset:0;pointer-events:none;overflow:visible}
  .col-head{position:absolute;font-family:var(--mono);font-size:10.5px;letter-spacing:1.4px;
     text-transform:uppercase;color:var(--muted2);white-space:nowrap}
  .node{position:absolute;background:var(--panel);border:1px solid var(--border);border-left-width:3px;
     border-radius:7px;padding:7px 9px;cursor:pointer;transition:opacity .18s,border-color .15s,box-shadow .15s,transform .08s;
     overflow:hidden}
  .node:hover{border-color:#3a3a42;transform:translateY(-1px)}
  .node .nlabel{font-family:var(--mono);font-size:11.5px;font-weight:600;line-height:1.25;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node .nsub{font-family:var(--mono);font-size:9.5px;color:var(--muted);line-height:1.3;margin-top:2px;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node .flagdot{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%}
  .node.dim{opacity:.12}
  .node.active{box-shadow:0 0 0 1px var(--accent),0 0 16px -4px var(--accent)}
  .node.sel{box-shadow:0 0 0 2px var(--accent),0 0 22px -3px var(--accent)}
  .node.hl{border-color:currentColor}

  /* sidebar */
  aside{border-left:1px solid var(--border);background:var(--panel2);overflow:auto;display:flex;flex-direction:column}
  .sec{padding:14px 16px;border-bottom:1px solid var(--border)}
  .sec h2{margin:0 0 10px;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted2);font-family:var(--mono)}
  .flow{border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s}
  .flow:hover{border-color:#3a3a42;background:#151519}
  .flow.on{border-color:var(--accent);background:rgba(245,179,1,.07)}
  .flow .fname{font-size:12.5px;font-weight:600}
  .flow .factor{font-family:var(--mono);font-size:10px;color:var(--accent);margin-top:2px;opacity:.85}
  .flow .fsum{color:var(--muted);font-size:11px;line-height:1.45;margin-top:5px;display:none}
  .flow.on .fsum{display:block}
  .btn{background:var(--panel);border:1px solid var(--border);color:var(--muted);border-radius:7px;
     padding:7px 11px;font-size:12px;cursor:pointer;font-family:var(--mono)}
  .btn:hover{border-color:#3a3a42;color:var(--text)}
  #ctx{flex:1}
  .step{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed #1f1f25}
  .step:last-child{border-bottom:0}
  .badge{flex:none;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#1a1400;
     font-family:var(--mono);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .step .path{font-family:var(--mono);font-size:11px;font-weight:600;line-height:1.3}
  .step .arrow{color:var(--accent)}
  .step .act{color:var(--muted);font-size:11.5px;line-height:1.45;margin-top:3px}
  .step .files{margin-top:4px}
  .fref{display:inline-block;font-family:var(--mono);font-size:10px;color:var(--muted2);
     background:#131317;border:1px solid var(--border);border-radius:4px;padding:1px 5px;margin:2px 4px 0 0}
  .dtitle{font-family:var(--mono);font-size:14px;font-weight:700}
  .dsub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
  .dlayer{display:inline-block;font-size:10px;font-family:var(--mono);border-radius:4px;padding:2px 7px;margin-top:8px}
  .drow{margin-top:12px}
  .drow .k{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted2);font-family:var(--mono);margin-bottom:5px}
  .dprose{color:#cfcfd6;font-size:12.5px;line-height:1.55}
  .chip{display:inline-block;font-family:var(--mono);font-size:10px;color:var(--accent);
     background:rgba(245,179,1,.08);border:1px solid rgba(245,179,1,.25);border-radius:4px;padding:1px 6px;margin:0 4px 4px 0}
  .flink{color:var(--accent);cursor:pointer;font-size:11.5px;display:block;padding:3px 0;border-bottom:1px dashed #1f1f25}
  .flink:hover{text-decoration:underline}
  .note{color:var(--muted);font-size:11.5px;line-height:1.5;background:#0e0e11;border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-top:8px}
  .inv{color:#cfcfd6;font-size:11.5px;line-height:1.5;padding:7px 0;border-bottom:1px dashed #1f1f25}
  .inv:before{content:"▸ ";color:var(--accent)}
  .mtx{width:100%;border-collapse:collapse;font-size:11px;margin-top:4px}
  .mtx th,.mtx td{border:1px solid var(--border);padding:4px 6px;text-align:center;font-family:var(--mono)}
  .mtx td.cap{text-align:left;color:var(--muted);font-family:var(--sans)}
  .mtx td.y{color:#34d399}.mtx td.n{color:#5f5f68}.mtx td.p{color:var(--accent)}
  @media (max-width:960px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 60vh auto}
    aside{border-left:0;border-top:1px solid var(--border)}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="h-title"></h1>
    <p id="h-sub"></p>
    <div class="stack" id="h-stack"></div>
    <div class="legend" id="h-legend"></div>
    <div class="toolbar">
      <input class="search" id="search" placeholder="filter nodes…" />
      <label class="toggle"><input type="checkbox" id="tog-edges" checked /> base connections</label>
      <button class="btn" id="clear">clear selection</button>
      <span class="hint" id="h-hint"></span>
    </div>
  </header>

  <div class="stage" id="stage">
    <div id="canvas">
      <svg class="edges" id="svg"></svg>
    </div>
  </div>

  <aside>
    <div class="sec">
      <h2>Flows</h2>
      <div id="flows"></div>
    </div>
    <div class="sec" id="ctx"></div>
    <div class="sec">
      <h2>Permissions → RLS</h2>
      <div id="matrix"></div>
    </div>
    <div class="sec">
      <h2>Invariants (read me)</h2>
      <div id="invariants"></div>
    </div>
  </aside>
</div>

to":"api-zohoconnect","action":"GET /api/zoho/connect — requireAdmin, set httpOnly state cookie (10 min)","files":["app/api/zoho/connect/route.ts"]},{"n":3,"from":"api-zohoconnect","to":"x-zoho","action":"302 to consent: access_type=offline&prompt=consent&scope=<read-only>","files":[]},{"n":4,"from":"x-zoho","to":"api-zohoconnect","action":"redirect back with ?code&state&accounts-server","files":["app/api/zoho/callback/route.ts"]},{"n":5,"from":"api-zohoconnect","to":"x-zoho","action":"POST {accounts-server}/oauth/v2/token — code -> refresh + access token","files":[]},{"n":6,"from":"api-zohoconnect","to":"t-zoho","action":"upsert singleton row (service role; RLS has no policies)","files":["lib/zoho/tokens.ts"]},{"n":7,"from":"api-zohoconnect","to":"s-settings","action":"redirect /settings?zoho=connected -> toast + Connected state","files":[]}]},{"id":"f-zoho-leads","name":"Zoho lead lookup (Estimator)","actor":"Manager/Admin","summary":"Search ~122k CRM leads live from the quote's Setup tab and fill the client. Read-only: nothing is copied into the app except the chosen client name.","steps":[{"n":1,"from":"a-manager","to":"s-propeditor","action":"Setup tab -> 'Find in Zoho' -> type 2+ chars (400ms debounce = 1 API credit)","files":["components/features/proposals/ZohoLeadLookup.tsx"]},{"n":2,"from":"s-propeditor","to":"api-zoholeads","action":"GET /api/zoho/leads/search?q=","files":["app/api/zoho/leads/search/route.ts"]},{"n":3,"from":"api-zoholeads","to":"b-zohoguard","action":"requireZohoReader() — admin/manager only (PII)","files":["lib/zoho/guard.ts"]},{"n":4,"from":"api-zoholeads","to":"b-zohotokens","action":"zohoFetch() — access token auto-refreshed if stale","files":["lib/zoho/tokens.ts"]},{"n":5,"from":"b-zohotokens","to":"x-zoho","action":"GET /crm/v2/Leads/search?word=<q> (matches name, company, phone) — 204 = no match","files":[]},{"n":6,"from":"api-zoholeads","to":"s-propeditor","action":"<=25 normalized leads {name, company, phone, email, status}","files":[]},{"n":7,"from":"s-propeditor","to":"st-proposals","action":"updateProposal({client_name: company || name}) — only the name is kept","files":[]}]}],"invariants":["RLS is the authoritative authorization wall (0002_rls.sql +); usePermissions() is a UX mirror only — keep the two in lockstep.","isSupabaseConfigured is the single demo/live switch. No env -> Zustand + localStorage demo with DUMMY_* seeds. Live -> stores start empty + loading, hydrate via WorkspaceSync; localStorage persists EMPTY (partialize) so Supabase stays the source of truth.","Live writes are optimistic write-through + structuredClone snapshot rollback; demo writes use a one-shot Undo toast (not a stack).","Live IDs are crypto.randomUUID() generated client-side up front — no temp->real swap.","Realtime publishes only 8 tables: notifications, activity, projects, sprints, tasks, task_assignees, task_comments, comment_reactions. proposals / time_entries / member_skills / availability_entries / weekly_capacity / profiles / allowed_emails hydrate on load only.","Guided estimates ship with add-ons OFF (phases already itemize design/QA/PM) to avoid double counting; risk / timeline / Min-Mid-Max are derived by analyzeDiscovery on the fly, never stored.","Line math: base_hours × tier (basic 1 / advanced 1.5 / custom 2) × qty. Roll-up add-ons compound: responsive -> design -> qa -> pm. requirements_unclear forces every line to Advanced.","Time logging is server-enforced: only an accepted assignee (or admin) can log hours (time_entries insert RLS + tasks_guard_hours trigger). Managers/coordinators cannot log hours.","Invites are single-use GET links; email SafeLinks scanners can burn them, so /auth/confirm verifies the OTP only on button click and /api/invites self-heals a burned invite (delete unconfirmed + resend).","Privileged ops (invite, ban/unban, hard-delete) never run in the browser — only via 3 service-role API routes behind requireAdmin().","Hard delete anonymizes: owner/reporter/author FKs are ON DELETE SET NULL ('Former member', 0020). Deactivate is a reversible ban + deactivated_at flag.","page_access is a per-user href allowlist, orthogonal to role, guarded against self-grant (0027). PageAccessGuard only gates paths present in dashboard-nav-config (gateableNavItems) — a route missing from that list is reachable by any authenticated user.","Next 16: the root middleware file is proxy.ts (renamed from middleware.ts).","TanStack Query is installed but NOT wired (no QueryClientProvider) — the synced-store bridge covers caching. There is no lib/api and no axios; supabase-js replaces that layer.","Esther (AI chat): store + EstherClient exist but the /esther route is coming-soon / unwired.","Email is Supabase built-in GoTrue only — no Postmark/Resend/SendGrid/SMTP dependency anywhere.","A project's timeline IS its sprints — there is no separate timeline table. convertToProject scaffolds one sprint per estimate phase and slots each seeded task in (join key: phaseLabelForLineItem <-> PHASE_META[id].label; unmatched -> backlog). GanttClient renders it, and `lockedProjectId` embeds it on the project page.","convertToProject / regenerateSchedule must insert sprints BEFORE tasks (task.sprint_id FK) AND optimistically upsert both into the stores — a realtime echo is not guaranteed to arrive before the user navigates. Skipping the optimistic upsert caused the 'converted project looks empty' bug.","The assignment engine never assigns a task to a dev lacking the matched skill. skillTiers() returns tiers best-first and the FIRST tier with an eligible dev wins, so specialists beat generalists. Phases with no dev-skill mapping (design/discovery/content/SEO) stay unassigned but still reserve time. Only confirmed+active profiles WITH skills are eligible — an unseeded workspace assigns everything to the one skilled user.","zoho_connection (0028) has RLS ENABLED WITH NO POLICIES on purpose: only the service-role key may read/write it. Verified — anon SELECT returns 0 rows, INSERT 401, UPDATE/DELETE report 204 but match 0 rows. Zoho tokens must never reach the browser; /api/zoho/status returns metadata only.","Zoho scopes are frozen into the token at consent time (currently READ-only: modules/users/org/settings). Widening them requires editing ZOHO_SCOPES, redeploying, AND a Disconnect -> Connect re-consent — an existing refresh token cannot gain scope.","Zoho API quirks that cost time: search `criteria` supports only equals/starts_with (`contains` -> 400 INVALID_QUERY), so single-box search uses `word=`; record counts need v2.1+ (`/actions/count` 400s on v2); the callback must use the `accounts-server` query param, not a hardcoded DC; bulk read needs a separate ZohoCRM.bulk.READ scope."],"permissionsMatrix":{"columns":["Admin","Manager","Member","Viewer"],"rows":[{"cap":"Create / edit project","v":["Yes","Yes","No","No"],"rls":"0002_rls.sql:38"},{"cap":"Delete project","v":["Yes","No","No","No"],"rls":"0002_rls.sql:42"},{"cap":"Create / edit task","v":["Yes","Yes","Yes","No"],"rls":"0002_rls.sql:55 / 0027:26"},{"cap":"Delete task","v":["Yes","Yes","No","No"],"rls":"0002_rls.sql:59"},{"cap":"Manage team (invite/deactivate/delete)","v":["Yes","No","No","No"],"rls":"profiles 0002:31 / allowed_emails 0012:21"},{"cap":"Export proposals + Estimator","v":["Yes","Yes","No","No"],"rls":"0002_rls.sql:103"},{"cap":"Edit others' PTO / availability","v":["Yes","Yes","No","No"],"rls":"availability 0002:86 / capacity 0002:92"},{"cap":"Edit member skills (self always)","v":["Yes","Yes","self","self"],"rls":"0026_member_skills.sql:28"},{"cap":"Log hours (accepted assignee)","v":["Yes","assignee","assignee","No"],"rls":"time_entries 0017:27 / tasks_guard_hours 0018"},{"cap":"View all content","v":["Yes","Yes","Yes","Yes"],"rls":"select: auth.role()='authenticated'"},{"cap":"Connect / disconnect Zoho CRM","v":["Yes","No","No","No"],"rls":"app/api/zoho/*: requireAdmin()"},{"cap":"Search Zoho leads (PII)","v":["Yes","Yes","No","No"],"rls":"lib/zoho/guard.ts: requireZohoReader()"}]}};
</script>
<script>
/* ---- viewer ---- */
const COL_W=200, COL_GAP=62, ROW_H=64, CARD_H=48, HEAD_H=34, PAD_L=30, PAD_T=44;
const byId = Object.fromEntries(DATA.nodes.map(n=>[n.id,n]));
const layerById = Object.fromEntries(DATA.layers.map(l=>[l.id,l]));
const pos = {};
const state = { flow:null, node:null, hover:null, search:"", showEdges:true };

/* layout: column per layer, stacked rows */
function layout(){
  DATA.layers.forEach((l,ci)=>{
    const items = DATA.nodes.filter(n=>n.layer===l.id);
    items.forEach((n,ri)=>{
      pos[n.id] = { x: PAD_L + ci*(COL_W+COL_GAP), y: PAD_T + HEAD_H + ri*ROW_H, col:ci };
    });
  });
  const maxRows = Math.max(...DATA.layers.map(l=>DATA.nodes.filter(n=>n.layer===l.id).length));
  const w = PAD_L*2 + DATA.layers.length*COL_W + (DATA.layers.length-1)*COL_GAP;
  const h = PAD_T*2 + HEAD_H + maxRows*ROW_H;
  const c = document.getElementById('canvas');
  c.style.width = w+'px'; c.style.height = h+'px';
  const svg = document.getElementById('svg');
  svg.setAttribute('width',w); svg.setAttribute('height',h); svg.setAttribute('viewBox','0 0 '+w+' '+h);
}

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const esc = s => String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* build header + columns + node cards once */
function build(){
  document.getElementById('h-title').textContent = DATA.meta.title;
  document.getElementById('h-sub').textContent = DATA.meta.subtitle;
  document.getElementById('h-stack').textContent = DATA.meta.stack;
  document.getElementById('h-hint').textContent = 'mode: '+DATA.meta.mappedFrom.replace(/\.$/,'')+' · '+DATA.nodes.length+' nodes · '+DATA.flows.length+' flows';
  const leg = document.getElementById('h-legend');
  DATA.legend.forEach(x=>{ const i=el('div','item'); i.append(dot(x.color), document.createTextNode(x.label)); leg.append(i); });

  const canvas = document.getElementById('canvas');
  DATA.layers.forEach((l,ci)=>{
    const hd = el('div','col-head', esc(l.title.toUpperCase()));
    hd.style.left = (PAD_L + ci*(COL_W+COL_GAP))+'px'; hd.style.top = PAD_T+'px';
    hd.style.width = COL_W+'px'; hd.style.color = l.color; hd.style.opacity='.65';
    canvas.append(hd);
  });
  DATA.nodes.forEach(n=>{
    const p = pos[n.id], l = layerById[n.layer];
    const node = el('div','node');
    node.id = 'node-'+n.id;
    node.style.left=p.x+'px'; node.style.top=p.y+'px'; node.style.width=COL_W+'px';
    node.style.minHeight=CARD_H+'px'; node.style.borderLeftColor=l.color; node.style.color=l.color;
    node.innerHTML = '<div class="nlabel" style="color:var(--text)">'+esc(n.label)+'</div>'+
                     (n.sub?'<div class="nsub">'+esc(n.sub)+'</div>':'');
    if(n.flags){ const f=flagColor(n.flags); if(f){const d=el('span','flagdot');d.style.background=f;node.append(d);} }
    node.addEventListener('click',e=>{e.stopPropagation();selectNode(n.id);});
    node.addEventListener('mouseenter',()=>{ if(!state.flow){ state.hover=n.id; paint(); }});
    node.addEventListener('mouseleave',()=>{ if(state.hover===n.id){ state.hover=null; paint(); }});
    canvas.append(node);
  });

  const fl = document.getElementById('flows');
  DATA.flows.forEach(f=>{
    const d = el('div','flow'); d.id='flow-'+f.id;
    d.innerHTML='<div class="fname">'+esc(f.name)+'</div><div class="factor">'+esc(f.actor)+'</div><div class="fsum">'+esc(f.summary)+'</div>';
    d.addEventListener('click',()=>selectFlow(f.id));
    fl.append(d);
  });

  buildMatrix(); buildInvariants();
  document.getElementById('search').addEventListener('input',e=>{state.search=e.target.value.trim().toLowerCase();paint();});
  document.getElementById('tog-edges').addEventListener('change',e=>{state.showEdges=e.target.checked;paint();});
  document.getElementById('clear').addEventListener('click',()=>{state.flow=null;state.node=null;state.hover=null;renderCtx();paint();syncFlowButtons();});
  document.getElementById('stage').addEventListener('click',()=>{ if(state.node){state.node=null;renderCtx();paint();} });
}
function dot(color){const d=el('span','dot');d.style.background=color;return d;}
function flagColor(f){ if(f.serviceRole)return '#ef4444'; if(f.gated)return '#f5b301'; if(f.modeSwitch)return '#22d3ee'; if(f.planned||f.demoOnly)return '#5f5f68'; if(f.pending)return '#ec4899'; return null; }

/* ---- edge geometry ---- */
function anchors(a,b){
  const A=pos[a], B=pos[b]; const ah=nodeH(a), bh=nodeH(b);
  const ay=A.y+ah/2, by=B.y+bh/2;
  let ax,bx,dir;
  if(B.x>=A.x){ ax=A.x+COL_W; bx=B.x; dir=1; } else { ax=A.x; bx=B.x+COL_W; dir=-1; }
  return {ax,ay,bx,by,dir};
}
function nodeH(id){ const e=document.getElementById('node-'+id); return e?e.offsetHeight:CARD_H; }
function pathFor(a,b){
  const {ax,ay,bx,by,dir}=anchors(a,b);
  const dx=Math.abs(bx-ax); const off=Math.max(38,Math.min(150,dx*0.45))*dir;
  const c1x=ax+off, c2x=bx-off;
  const d='M '+ax+' '+ay+' C '+c1x+' '+ay+' '+c2x+' '+by+' '+bx+' '+by;
  const mx=0.125*ax+0.375*c1x+0.375*c2x+0.125*bx;
  const my=0.125*ay+0.375*ay+0.375*by+0.125*by;
  return {d,mx,my};
}
function line(a,b,cls,color,w,dash){
  const {d}=pathFor(a,b);
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',d); p.setAttribute('fill','none'); p.setAttribute('class',cls);
  p.setAttribute('stroke',color); p.setAttribute('stroke-width',w);
  if(dash)p.setAttribute('stroke-dasharray',dash);
  return p;
}
function numBadge(a,b,n){
  const {mx,my}=pathFor(a,b);
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  const off=(n%2?-1:1)*(n>0?8:0);
  const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('cx',mx);c.setAttribute('cy',my+off);c.setAttribute('r',9);c.setAttribute('fill','#f5b301');
  const t=document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('x',mx);t.setAttribute('y',my+off+3.5);t.setAttribute('text-anchor','middle');
  t.setAttribute('font-size','11');t.setAttribute('font-weight','700');t.setAttribute('font-family','var(--mono)');t.setAttribute('fill','#1a1400');
  t.textContent=n;
  g.append(c,t);return g;
}

/* ---- paint: edges + node classes for current state ---- */
function paint(){
  const svg=document.getElementById('svg'); svg.innerHTML='';
  const activeNodes=new Set(); let flowEdges=[];
  if(state.flow){
    const f=DATA.flows.find(x=>x.id===state.flow);
    f.steps.forEach(s=>{activeNodes.add(s.from);activeNodes.add(s.to);flowEdges.push(s);});
  } else if(state.node){
    activeNodes.add(state.node);
    DATA.edges.forEach(e=>{ if(e.from===state.node)activeNodes.add(e.to); if(e.to===state.node)activeNodes.add(e.from); });
  } else if(state.hover){
    activeNodes.add(state.hover);
    DATA.edges.forEach(e=>{ if(e.from===state.hover)activeNodes.add(e.to); if(e.to===state.hover)activeNodes.add(e.from); });
  }
  // base faint edges
  if(state.showEdges){
    DATA.edges.forEach(e=>{
      const incident = (state.node&&(e.from===state.node||e.to===state.node)) || (state.hover&&!state.flow&&(e.from===state.hover||e.to===state.hover));
      let pth;
      if(state.flow){ pth=line(e.from,e.to,'','#ffffff',1,null); pth.setAttribute('opacity','0.03'); }
      else if(incident){ pth=line(e.from,e.to,'',layerById[byId[e.from].layer].color,1.6,null); }
      else { pth=line(e.from,e.to,'','#ffffff',1,null); pth.setAttribute('opacity','0.055'); }
      svg.append(pth);
    });
  }
  // flow edges + badges on top
  if(state.flow){ flowEdges.forEach(s=>{ svg.append(line(s.from,s.to,'','#f5b301',2.1,null)); }); flowEdges.forEach(s=>{ svg.append(numBadge(s.from,s.to,s.n)); }); }

  // node classes
  const searching = state.search.length>0;
  DATA.nodes.forEach(n=>{
    const e=document.getElementById('node-'+n.id); e.className='node';
    const sMatch = !searching || (n.label+' '+(n.sub||'')+' '+(n.purpose||'')).toLowerCase().includes(state.search);
    if(!sMatch){ e.classList.add('dim'); return; }
    if(state.flow||state.node||state.hover){
      if(activeNodes.has(n.id)){ e.classList.add(state.flow?'active':'hl'); if(n.id===state.node)e.classList.add('sel'); }
      else e.classList.add('dim');
    }
    if(searching && sMatch && !(state.flow||state.node)) e.classList.add('hl');
  });
}

/* ---- selection ---- */
function selectFlow(id){ state.flow=(state.flow===id?null:id); state.node=null; state.hover=null; syncFlowButtons(); renderCtx(); paint();
  if(state.flow) document.getElementById('flow-'+id).scrollIntoView({block:'nearest'}); }
function selectNode(id){ state.node=id; state.flow=null; state.hover=null; syncFlowButtons(); renderCtx(); paint(); }
function syncFlowButtons(){ DATA.flows.forEach(f=>document.getElementById('flow-'+f.id).classList.toggle('on',state.flow===f.id)); }

function renderCtx(){
  const ctx=document.getElementById('ctx');
  if(state.flow){ renderSteps(ctx); }
  else if(state.node){ renderNode(ctx); }
  else { ctx.innerHTML='<h2>Steps / details</h2><div class="dprose" style="color:var(--muted)">Select a flow to trace its numbered path across the diagram, or click any node to see its files, tables and the flows it takes part in.</div>'; }
}
function renderSteps(ctx){
  const f=DATA.flows.find(x=>x.id===state.flow);
  let h='<h2>'+esc(f.name)+'</h2><div class="dprose" style="color:var(--muted);margin-bottom:10px">'+esc(f.summary)+'</div>';
  f.steps.forEach(s=>{
    h+='<div class="step"><div class="badge">'+s.n+'</div><div><div class="path">'+esc(byId[s.from].label)+' <span class="arrow">→</span> '+esc(byId[s.to].label)+'</div>'+
       '<div class="act">'+esc(s.action)+'</div>'+
       (s.files&&s.files.length?'<div class="files">'+s.files.map(x=>'<span class="fref">'+esc(x)+'</span>').join('')+'</div>':'')+
       '</div></div>';
  });
  ctx.innerHTML=h;
}
function renderNode(ctx){
  const n=byId[state.node], l=layerById[n.layer];
  let h='<div class="dtitle">'+esc(n.label)+'</div>'+(n.sub?'<div class="dsub">'+esc(n.sub)+'</div>':'');
  h+='<span class="dlayer" style="color:'+l.color+';background:'+l.color+'1a;border:1px solid '+l.color+'55">'+esc(l.title)+'</span>';
  if(n.purpose) h+='<div class="drow"><div class="k">what it does</div><div class="dprose">'+esc(n.purpose)+'</div></div>';
  if(n.files&&n.files.length) h+='<div class="drow"><div class="k">files</div>'+n.files.map(x=>'<span class="fref">'+esc(x)+'</span>').join('')+'</div>';
  if(n.tables&&n.tables.length) h+='<div class="drow"><div class="k">tables</div>'+n.tables.map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div>';
  if(n.flags){ const fk=Object.entries(n.flags).map(([k,v])=>'<span class="chip">'+esc(k)+(v===true?'':': '+esc(v))+'</span>').join(''); h+='<div class="drow"><div class="k">flags</div>'+fk+'</div>'; }
  if(n.notes) h+='<div class="note">'+esc(n.notes)+'</div>';
  const inFlows=DATA.flows.filter(f=>f.steps.some(s=>s.from===n.id||s.to===n.id));
  if(inFlows.length){ h+='<div class="drow"><div class="k">appears in flows</div>'+inFlows.map(f=>'<span class="flink" data-f="'+f.id+'">→ '+esc(f.name)+'</span>').join('')+'</div>'; }
  ctx.innerHTML=h;
  ctx.querySelectorAll('.flink').forEach(a=>a.addEventListener('click',()=>selectFlow(a.dataset.f)));
}
function buildMatrix(){
  const m=DATA.permissionsMatrix; let h='<table class="mtx"><tr><th style="text-align:left">Capability</th>'+m.columns.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>';
  m.rows.forEach(r=>{ h+='<tr><td class="cap">'+esc(r.cap)+'</td>'+r.v.map(v=>{const c=v==='Yes'?'y':(v==='No'?'n':'p');return '<td class="'+c+'">'+esc(v)+'</td>';}).join('')+'</tr>'; });
  h+='</table>'; document.getElementById('matrix').innerHTML=h;
}
function buildInvariants(){ document.getElementById('invariants').innerHTML=DATA.invariants.map(x=>'<div class="inv">'+esc(x)+'</div>').join(''); }

/* boot */
layout(); build(); renderCtx();
if(DATA.flows.length) selectFlow(DATA.flows[0].id);
let rt; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{paint();},120);});
</script>
</body>
