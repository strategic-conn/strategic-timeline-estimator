<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Timeline Estimator — Architecture & Flows</title>
<style>
  :root{
    --bg:#0b0b0d; --panel:#141417; --panel2:#0f0f12; --border:#26262c;
    --text:#e7e7ea; --muted:#8a8a93; --muted2:#5f5f68; --accent:#f5b301;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;overflow:hidden}
  a{color:inherit}
  .app{display:grid;grid-template-columns:1fr 372px;grid-template-rows:auto 1fr;height:100vh;gap:0}
  header{grid-column:1/3;border-bottom:1px solid var(--border);padding:16px 22px;background:linear-gradient(180deg,#101013,#0b0b0d)}
  header h1{margin:0;font-size:17px;letter-spacing:.2px}
  header p{margin:6px 0 0;color:var(--muted);max-width:1100px;line-height:1.5;font-size:12.5px}
  .stack{margin-top:8px;color:var(--muted2);font-family:var(--mono);font-size:11px;line-height:1.6}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}
  .legend .item{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11.5px}
  .legend .dot{width:10px;height:10px;border-radius:3px;flex:none}
  .toolbar{display:flex;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap}
  .search{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:7px 11px;color:var(--text);font-family:var(--mono);font-size:12px;width:260px}
  .search::placeholder{color:var(--muted2)}
  .toggle{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;cursor:pointer;user-select:none}
  .toggle input{accent-color:var(--accent)}
  .hint{color:var(--muted2);font-size:11.5px}

  /* diagram */
  .stage{position:relative;overflow:auto;background:
     radial-gradient(circle at 1px 1px,rgba(255,255,255,.03) 1px,transparent 0);
     background-size:26px 26px}
  #canvas{position:relative}
  svg.edges{position:absolute;inset:0;pointer-events:none;overflow:visible}
  .col-head{position:absolute;font-family:var(--mono);font-size:10.5px;letter-spacing:1.4px;
     text-transform:uppercase;color:var(--muted2);white-space:nowrap}
  .node{position:absolute;background:var(--panel);border:1px solid var(--border);border-left-width:3px;
     border-radius:7px;padding:7px 9px;cursor:pointer;transition:opacity .18s,border-color .15s,box-shadow .15s,transform .08s;
     overflow:hidden}
  .node:hover{border-color:#3a3a42;transform:translateY(-1px)}
  .node .nlabel{font-family:var(--mono);font-size:11.5px;font-weight:600;line-height:1.25;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node .nsub{font-family:var(--mono);font-size:9.5px;color:var(--muted);line-height:1.3;margin-top:2px;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node .flagdot{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%}
  .node.dim{opacity:.12}
  .node.active{box-shadow:0 0 0 1px var(--accent),0 0 16px -4px var(--accent)}
  .node.sel{box-shadow:0 0 0 2px var(--accent),0 0 22px -3px var(--accent)}
  .node.hl{border-color:currentColor}

  /* sidebar */
  aside{border-left:1px solid var(--border);background:var(--panel2);overflow:auto;display:flex;flex-direction:column}
  .sec{padding:14px 16px;border-bottom:1px solid var(--border)}
  .sec h2{margin:0 0 10px;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted2);font-family:var(--mono)}
  .flow{border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s}
  .flow:hover{border-color:#3a3a42;background:#151519}
  .flow.on{border-color:var(--accent);background:rgba(245,179,1,.07)}
  .flow .fname{font-size:12.5px;font-weight:600}
  .flow .factor{font-family:var(--mono);font-size:10px;color:var(--accent);margin-top:2px;opacity:.85}
  .flow .fsum{color:var(--muted);font-size:11px;line-height:1.45;margin-top:5px;display:none}
  .flow.on .fsum{display:block}
  .btn{background:var(--panel);border:1px solid var(--border);color:var(--muted);border-radius:7px;
     padding:7px 11px;font-size:12px;cursor:pointer;font-family:var(--mono)}
  .btn:hover{border-color:#3a3a42;color:var(--text)}
  #ctx{flex:1}
  .step{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed #1f1f25}
  .step:last-child{border-bottom:0}
  .badge{flex:none;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#1a1400;
     font-family:var(--mono);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .step .path{font-family:var(--mono);font-size:11px;font-weight:600;line-height:1.3}
  .step .arrow{color:var(--accent)}
  .step .act{color:var(--muted);font-size:11.5px;line-height:1.45;margin-top:3px}
  .step .files{margin-top:4px}
  .fref{display:inline-block;font-family:var(--mono);font-size:10px;color:var(--muted2);
     background:#131317;border:1px solid var(--border);border-radius:4px;padding:1px 5px;margin:2px 4px 0 0}
  .dtitle{font-family:var(--mono);font-size:14px;font-weight:700}
  .dsub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
  .dlayer{display:inline-block;font-size:10px;font-family:var(--mono);border-radius:4px;padding:2px 7px;margin-top:8px}
  .drow{margin-top:12px}
  .drow .k{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted2);font-family:var(--mono);margin-bottom:5px}
  .dprose{color:#cfcfd6;font-size:12.5px;line-height:1.55}
  .chip{display:inline-block;font-family:var(--mono);font-size:10px;color:var(--accent);
     background:rgba(245,179,1,.08);border:1px solid rgba(245,179,1,.25);border-radius:4px;padding:1px 6px;margin:0 4px 4px 0}
  .flink{color:var(--accent);cursor:pointer;font-size:11.5px;display:block;padding:3px 0;border-bottom:1px dashed #1f1f25}
  .flink:hover{text-decoration:underline}
  .note{color:var(--muted);font-size:11.5px;line-height:1.5;background:#0e0e11;border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-top:8px}
  .inv{color:#cfcfd6;font-size:11.5px;line-height:1.5;padding:7px 0;border-bottom:1px dashed #1f1f25}
  .inv:before{content:"▸ ";color:var(--accent)}
  .mtx{width:100%;border-collapse:collapse;font-size:11px;margin-top:4px}
  .mtx th,.mtx td{border:1px solid var(--border);padding:4px 6px;text-align:center;font-family:var(--mono)}
  .mtx td.cap{text-align:left;color:var(--muted);font-family:var(--sans)}
  .mtx td.y{color:#34d399}.mtx td.n{color:#5f5f68}.mtx td.p{color:var(--accent)}
  @media (max-width:960px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 60vh auto}
    aside{border-left:0;border-top:1px solid var(--border)}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="h-title"></h1>
    <p id="h-sub"></p>
    <div class="stack" id="h-stack"></div>
    <div class="legend" id="h-legend"></div>
    <div class="toolbar">
      <input class="search" id="search" placeholder="filter nodes…" />
      <label class="toggle"><input type="checkbox" id="tog-edges" checked /> base connections</label>
      <button class="btn" id="clear">clear selection</button>
      <span class="hint" id="h-hint"></span>
    </div>
  </header>

  <div class="stage" id="stage">
    <div id="canvas">
      <svg class="edges" id="svg"></svg>
    </div>
  </div>

  <aside>
    <div class="sec">
      <h2>Flows</h2>
      <div id="flows"></div>
    </div>
    <div class="sec" id="ctx"></div>
    <div class="sec">
      <h2>Permissions → RLS</h2>
      <div id="matrix"></div>
    </div>
    <div class="sec">
      <h2>Invariants (read me)</h2>
      <div id="invariants"></div>
    </div>
  </aside>
</div>

<script>
const DATA = {"_readme": "Machine-readable architecture map of the Timeline Estimator & PM tool, for the next agent. layers = diagram columns (left->right) with legend colors. nodes[] = the knowledge graph: {id,layer,label,sub,purpose,files[],tables?,notes?,flags?} — files are repo-relative path[:line]. edges[] = structural {from,to,label} dependency links (node ids). flows[] = ordered runtime paths, each step {n,from,to,action,files[]}. invariants[] = non-obvious rules to preserve when editing. permissionsMatrix mirrors Supabase RLS. Regenerate the HTML from this file (same object is inlined there).", "meta": {"title": "Timeline Estimator & PM Tool — Architecture & Flows", "subtitle": "Every actor, route, store, Supabase table, trigger, realtime channel and external service — and the flows that connect them. Pick a flow to trace the path; click any node to see its files.", "stack": "Next.js 16 (App Router) · React 19 · TypeScript · Zustand 5 (synced-store bridge) · Supabase (Auth · Postgres · RLS · Realtime · Storage) · Zoho CRM (OAuth2, read + 3 allow-listed writes) · PBS billing (create-only) · Tailwind 4 / shadcn", "repoRoot": "timeline-estimator-project-management-tool", "mappedFrom": "Static code analysis of app/, store/, hooks/, lib/, components/, supabase/migrations/ (45 migrations).", "dateMapped": "2026-10-01", "modeSwitch": "isSupabaseConfigured (lib/supabase/config.ts): NEXT_PUBLIC_SUPABASE_* present -> live Supabase (this map); absent -> Zustand + localStorage demo with DUMMY_* seeds.", "redirects": ["/tasks -> /projects", "/projects/[id]/tasks -> /projects/[id]", "/projects/[id]/sprints -> /projects/[id]", "/discovery -> /proposals", "/discovery/[id] -> /proposals"], "droppedTables": ["discovery_projects (added 0010, dropped 0023 -> merged into proposals.discovery jsonb)"]}, "legend": [{"label": "Actors & roles", "color": "#ec4899"}, {"label": "Client surfaces (routes)", "color": "#38bdf8"}, {"label": "State & permissions", "color": "#a78bfa"}, {"label": "Sync bridge & server seam", "color": "#22d3ee"}, {"label": "Supabase Auth · fns · RLS", "color": "#34d399"}, {"label": "Postgres data", "color": "#f59e0b"}, {"label": "Realtime & Storage", "color": "#818cf8"}, {"label": "External services", "color": "#94a3b8"}], "layers": [{"id": "actors", "title": "Actors & roles", "color": "#ec4899"}, {"id": "surfaces", "title": "Client surfaces (routes)", "color": "#38bdf8"}, {"id": "state", "title": "State & permissions", "color": "#a78bfa"}, {"id": "bridge", "title": "Sync bridge & server seam", "color": "#22d3ee"}, {"id": "auth", "title": "Supabase Auth · fns · RLS", "color": "#34d399"}, {"id": "data", "title": "Postgres data", "color": "#f59e0b"}, {"id": "rt", "title": "Realtime & Storage", "color": "#818cf8"}, {"id": "external", "title": "External services", "color": "#94a3b8"}], "nodes": [{"id": "a-admin", "layer": "actors", "label": "Admin", "sub": "role", "purpose": "Full control: team mgmt, invites, offboarding, delete projects, estimator.", "files": ["store/auth-store.ts:8"]}, {"id": "a-manager", "layer": "actors", "label": "Manager", "sub": "role", "purpose": "Create/edit projects & tasks, estimator, edit others' PTO/skills. No team mgmt, no project delete.", "files": ["hooks/usePermissions.ts:23"]}, {"id": "a-member", "layer": "actors", "label": "Member", "sub": "role", "purpose": "Create/edit tasks, log own hours (accepted assignments only), own PTO/skills.", "files": ["hooks/usePermissions.ts:23"]}, {"id": "a-viewer", "layer": "actors", "label": "Viewer", "sub": "role", "purpose": "Read-only across the app; action buttons hidden entirely, not just disabled.", "files": ["hooks/usePermissions.ts:23"]}, {"id": "a-invitee", "layer": "actors", "label": "Invitee", "sub": "pending state", "purpose": "Invited; profile exists with confirmed_at=null; cannot be assigned work until accepted.", "notes": "Not an app role — a pending team-member state (store/team-store.ts:95). Invite is a single-use link; SafeLinks scanners can burn it.", "flags": {"pending": true}}, {"id": "s-landing", "layer": "surfaces", "label": "/", "sub": "app/page.tsx", "purpose": "Marketing splash + InviteHashCatcher (forwards Supabase implicit-flow hash to /accept-invite).", "files": ["app/page.tsx", "components/features/auth/invite-hash-catcher.tsx"]}, {"id": "s-login", "layer": "surfaces", "label": "/login", "sub": "(auth)/login", "purpose": "Email/password sign-in; surfaces ?error=invite_invalid. Demo fakes success.", "files": ["app/(auth)/login/page.tsx:63"]}, {"id": "s-register", "layer": "surfaces", "label": "/register", "sub": "(auth)/register", "purpose": "Static invite-only notice — no self-signup.", "files": ["app/(auth)/register/page.tsx"]}, {"id": "s-forgot", "layer": "surfaces", "label": "/forgot-password", "sub": "(auth)", "purpose": "resetPasswordForEmail; always shows success (no account enumeration).", "files": ["app/(auth)/forgot-password/page.tsx"]}, {"id": "s-authconfirm", "layer": "surfaces", "label": "/auth/confirm", "sub": "app/auth/confirm", "purpose": "Verifies one-time email token on button click (SafeLinks-safe), then routes to ?next.", "files": ["app/auth/confirm/page.tsx:55"]}, {"id": "s-acceptinvite", "layer": "surfaces", "label": "/accept-invite", "sub": "(auth)", "purpose": "Set password after invite/recovery session; updateUser({password}) -> /dashboard.", "files": ["app/(auth)/accept-invite/page.tsx:60"]}, {"id": "s-dashlayout", "layer": "surfaces", "label": "Dashboard shell", "sub": "(dashboard)/layout.tsx", "purpose": "Mounts WorkspaceSync, PageAccessGuard, sidebar/header/mobile nav + NotificationBell.", "files": ["app/(dashboard)/layout.tsx:27", "app/(dashboard)/dashboard/page.tsx"]}, {"id": "s-dashboard", "layer": "surfaces", "label": "/dashboard", "sub": "always-on", "purpose": "Mine / Team scopes behind the shared MineTeamToggle (admin+manager get Team). Derives NO numbers of its own - assignedWork / capacityFor / utilization / statusBreakdown, the same four calls Workload mated hrs vs weekly capacity (team) + WorkloadMine (personal).", "files": ["components/features/workload/WorkloadClient.tsx", "components/features/workload/WorkloadMine.tsx"]}, {"id": "s-team", "layer": "surfaces", "label": "/team", "sub": "team-client", "purpose": "Members, inline role change, page-access dialog, skills, invites, deactivate/delete (admin only).", "files": ["app/(dashboard)/team/team-client.tsx", "components/features/settings/AdminInvitesSection.tsx"]}, {"id": "s-settings", "layer": "surfaces", "label": "/settings", "sub": "settings-client", "purpose": "Tabs: Profile · Skills · Time off · Workspace(stub) · Security(stub).", "files": ["app/(dashboard)/settings/settings-client.tsx"]}, {"id": "s-proposals", "layer": "surfaces", "label": "/proposals", "sub": "\"Estimator\" · ProposalsListClient", "purpose": "Quote list + create (guided or manual). Gated by canExportProposals.", "files": ["components/features/proposals/ProposalsListClient.tsx:139"], "flags": {"gated": "admin/manager (canExportProposals)"}}, {"id": "s-propeditor", "layer": "surfaces", "label": "/proposals/[id]", "sub": "ProposalEditorClient", "purpose": "5-tab estimator editor (Setup · Scope & risk · Line items · Adjust · Review) + export + Start project.", "files": ["components/features/proposals/ProposalEditorClient.tsx:365"], "flags": {"gated": "admin/manager (canExportProposals)"}}, {"id": "s-reports", "layer": "surfaces", "label": "/reports", "sub": "reports-client", "purpose": "Workspace stats from live stores (team via team-store). In nav config (workspace group) so PageAccessGuard gates it like other pages.", "files": ["app/(dashboard)/reports/reports-client.tsx"]}, {"id": "s-esther", "layer": "surfaces", "label": "/esther", "sub": "coming soon", "purpose": "Coming-soon card. EstherClient + esther-store exist but are NOT wired to this route.", "files": ["app/(dashboard)/esther/page.tsx"], "flags": {"planned": true}}, {"id": "st-projects", "layer": "state", "label": "projects-store Grid/SMTP lib anywhere — built-in only.", "files": [".env.example:9"]}, {"id": "x-jspdf", "layer": "external", "label": "jsPDF + jspdf-autotable", "sub": "client", "purpose": "Client-side PDF export of a quote (dynamic import).", "files": ["lib/utils/proposal-pdf-export.ts:25"]}, {"id": "x-xlsx", "layer": "external", "label": "xlsx (SheetJS)", "sub": "client", "purpose": "Client-side Excel export of a quote (dynamic import). Only file importing xlsx.", "files": ["lib/utils/proposal-excel-export.ts:21"]}, {"id": "x-dompurify", "layer": "external", "label": "DOMPurify", "sub": "client", "purpose": "Sanitizes mention HTML (span-only, class attr) before render.", "files": ["components/features/tasks/TaskCommentSection.tsx:65"]}, {"id": "x-sonner", "layer": "external", "label": "sonner", "sub": "toasts", "purpose": "Toasts for every store's error/success + one-shot Undo path.", "files": ["components/ui/sonner.tsx", "components/layouts/app-providers.tsx:14"]}, {"id": "x-theme", "layer": "external", "label": "next-themes", "sub": "theming", "purpose": "Light/dark theme.", "files": ["components/theme-provider.tsx"]}, {"id": "x-pravatar", "layer": "external", "label": "i.pravatar.cc", "sub": "demo only", "purpose": "Demo-only avatar seeds; not used in live mode.", "files": ["store/auth-store.ts:56"], "flags": {"demoOnly": true}}, {"id": "st-assign", "layer": "state", "label": "assignment engine", "sub": "pure · deterministic", "purpose": "planSchedule(tasks, devs, platform, {strategy, phaseStart}) -> per-task assignee + capacity-aware dates + finishDate. NOT AI. skillTiers() maps a task to required skills (platform skill for dev work; keyword rules for plugin/DNS/domain/go-live; Quality Assurance for QA); specialists win, generalists are a fallback tier. Strategies: quick (spread across qualified devs, earliest finish) vs efficient (highest-skilled, fewer hands). Work keys first (0043): where anyone holds a key in the task's discipline, only qualifying key holders are eligible (Level 2 covers Level 1) and stars break ties; other disciplines keep the skill-only rule. buildRoster() assembles devs from team + skills + work keys + weekly_capacity/5 + PTO. Self-check: lib/assignment/plan.check.ts (48 asserts). Keys: e2e/work-keys.spec.ts.", "files": ["lib/assignment/plan.ts", "lib/assignment/roster.ts", "lib/assignment/plan.check.ts"]}, {"id": "b-zohotokens", "layer": "bridge", "label": "zoho token store", "sub": "server-only · service-role", "purpose": "getAccessToken() returns a cached access token, refreshing ~1min before expiry via the stored refresh_token; zohoFetch(path) calls the CRM against the connection's api_domain with `Authorization: Zoho-oauthtoken`. Uses an untyped service-role client so it can read zoho_connection (RLS has no policies).", "files": ["lib/zoho/tokens.ts", "lib/zoho/config.ts"], "tables": ["zoho_connection"], "flags": {"serviceRole": true}}, {"id": "b-zohoguard", "layer": "bridge", "label": "requireZohoReader()", "sub": "admin + manager", "purpose": "Gate for CRM reads. Leads carry PII (names, phones, emails), so this is limited to admin + manager — the same tier as canExportProposals. Members/viewers get 403.", "files": ["lib/zoho/guard.ts"]}, {"id": "api-zohoconnect", "layer": "bridge", "label": "GET /api/zoho/connect · /callback", "sub": "OAuth2 authorization-code", "purpose": "connect: admin-only; sets an httpOnly SameSite=Lax `zoho_oauth_state` CSRF cookie and redirects to Zoho consent with access_type=offline&prompt=consent (guarantees a refresh_token). callback: verifies state, swaps the code for tokens on the DC-specific `accounts-server`, stores the singleton row, then redirects to /settings?zoho=<outcome> (connected | notstarted | statemissing | badstate | denied | exchangefailed | norefresh | savefailed).", "files": ["app/api/zoho/connect/route.ts", "app/api/zoho/callback/route.ts"], "tables": ["zoho_connection"]}, {"id": "api-zohoadmin", "layer": "bridge", "label": "GET /api/zoho/status · /org · POST /disconnect", "sub": "admin-only", "purpose": "status: reports {configured, connected, connectedAt, apiDomain} — never tokens. org: proof-of-connection, fetches /crm/v2/org. disconnect: deletes the stored connection.", "files": ["app/api/zoho/status/route.ts", "app/api/zoho/org/route.ts", "app/api/zoho/disconnect/route.ts"]}, {"id": "t-zoho", "layer": "data", "label": "zoho_connection", "sub": "0028 · singleton (id=true)", "purpose": "Workspace-wide Zoho OAuth tokens (refresh_token, access_token, api_domain, accounts_server, expires_at, connected_by). RLS ENABLED WITH NO POLICIES by design — unreachable by anon/authenticated; only the service-role key (server routes) can touch it.", "files": ["supabase/migrations/0028_zoho_connection.sql"], "tables": ["zoho_connection"]}, {"id": "x-zoho", "layer": "external", "label": "Zoho CRM", "sub": "accounts.zoho.com · zohoapis.com", "purpose": "OAuth at {accounts_server}/oauth/v2/token; REST at {api_domain}/crm/v2. Granted scopes (live) are READ-only: ZohoCRM.modules.READ, users.READ, org.READ, settings.READ. Org: Strategic Connection (~122k Leads, ~923 Deals). Phase 3 write scopes (deals.CREATE/UPDATE + attachments.CREATE, verified against Zoho's own docs, no DELETE/ALL) are STAGED in .env.local/.env.example only — inert until a Vercel env update + Disconnect→Connect re-consent by someone with Zoho CRM edit rights.", "files": ["lib/zoho/tokens.ts"]}, {"id": "api-zohodeals", "layer": "bridge", "label": "GET /api/zoho/deals", "sub": "read-only", "purpose": "Lists CRM Deals for the Estimator's import picker, by stage (`criteria=(Stage:equals:…)`) or free text (`word=`), else most-recently-modified. Builds a deep link per deal from the org id (cached per instance) since Zoho returns no record URL. Real deals often have Amount=0 and Service_Interested_in=null, so those are surfaced as optional. Also backs \"Link a Zoho deal\" in the quote editor: a quote created by hand has no deal to push to (the client alone is not enough — a company can have many deals), so the same picker attaches an existing deal to the current quote instead of creating a new one. Creating deals from the app was considered and rejected: every money field on Deals in this org is a formula (verified — a Deal_Amount write reports SUCCESS then reverts to 0), so app-created deals would be permanently $0 and owned by the connection identity rather than the real salesperson.", "files": ["app/api/zoho/deals/route.ts"]}, {"id": "api-zohoaccounts", "layer": "bridge", "label": "GET /api/zoho/accounts", "sub": "companies + their people", "purpose": "Three things: `?q=` searches Accounts (companies, ~4.0k) and — when nothing matches — falls back to searching Contacts and returns THEIR companies tagged `viaContact`; `?contactsOf=<id>` lists a company's people via /crm/v2/Accounts/{id}/Contacts; and every company list is enriched with that company's prior Deals via ONE batched `Account_Name:in:<ids>` query (verified: 25 ids in a single ~540ms call — per-account lookups would have been 25 calls). Deal enrichment is best-effort: a failure returns no deals rather than breaking the company list. Replaced the Leads lookup: Accounts/Contacts are the qualified records, Leads (~122k) are raw and noisy.", "files": ["app/api/zoho/accounts/route.ts"]}, {"id": "api-zohopush", "layer": "bridge", "label": "POST /api/zoho/deals/[id]/push", "sub": "WRITE — admin+manager", "purpose": "The app's only CRM writes, both explicit buttons. Quote editor -> Deal \"Proposal Sent\" + proposal PDF; project page (once status=completed) -> Deal \"Project Completed\", no attachment. Target stage is WHITELISTED in lib/zoho/push-state.ts so a crafted request can't set Closed Won/Lost — revenue stages stay sales' call. Writes ONLY Stage (Amount is a Zoho formula field, Quote_number a system autonumber; both verified unsettable). Idempotent PER STAGE via proposals.zoho.pushes (stage -> timestamp), checked+written server-side because Zoho does not dedupe attachments. Stage move is fatal-on-failure; the attachment is best-effort and warns.", "files": ["app/api/zoho/deals/[id]/push/route.ts", "lib/zoho/push-state.ts", "lib/zoho/guard.ts"], "tables": ["proposals"]}, {"id": "l-sync", "layer": "bridge", "label": "estimate ↔ project sync", "sub": "pure · two-way", "purpose": "diffEstimateToProject() reconciles a project's tasks against the estimate's line items (create / rename / re-hour / remove), keyed on tasks.source_line_item_id. applyTaskToLineItems() / removeLineItem() carry a task edit the other way, writing hours back through base_hours so the row stays internally consistent. A registry (registerTaskMirror / mirrorTaskChange) lets tasks-store notify the estimator store without an import cycle; withMirrorSuppressed() stops the estimate→project half echoing back. notifyProjectScheduleChanged() / registerScheduleWatcher() close the PBS loop: a sprint date change warns, at that moment, that the purchase order was billed against a range that no longer holds. A task carrying logged time is reported as `orphaned` and KEPT, never removed; mirrorTaskChange() returns a revert closure the tasks store calls on every rollback.", "files": ["lib/sync/estimate-project-sync.ts", "e2e/estimate-project-sync.spec.ts", "e2e/sync-surfaces.spec.ts"]}, {"id": "s-stageboard", "layer": "surfaces", "label": "/proposals · Stages", "sub": "ProposalStageBoard · default view", "purpose": "A Zoho-shaped pipeline of THIS app's estimates only. Columns are the org's own Deal Stage picklist in its own order, coloured by forecast bucket. Dragging a card moves the real deal; the stage that is stored is where the deal SETTLED, not what was asked for.", "files": ["components/features/proposals/ProposalStageBoard.tsx"], "flags": {"gated": "admin/manager (canExportProposals)"}}, {"id": "b-wontransition", "layer": "bridge", "label": "won-transition", "sub": "one rule, three callers", "purpose": "recordStageChange() (store the settled stage, then apply it) and applyWonTransition() (promote draft/sent -> approved, log activity, notify admins+managers) — guarded on the TRANSITION into a won forecast bucket. The poll, the status changer and the stage board all route through it so they cannot drift. Stage + promotion travel in ONE store write (applyDealStage), because persistQuoteDoc sends the whole document and two writes race.", "files": ["lib/zoho/won-transition.ts", "e2e/won-stage.spec.ts"]}, {"id": "api-dealstages", "layer": "bridge", "label": "GET /api/zoho/deal-stages", "sub": "settings.READ · 30-min cache", "purpose": "The org's own Deal Stage picklist (value, sequence_number, forecast_type, probability). One reader for the status changer, the board and the push route's validation, so the menu can never offer a stage the server rejects. The readable bucket is forecast_type — forecast_category is an opaque id.", "files": ["lib/zoho/stages.ts", "lib/zoho/stage-catalog.ts"]}, {"id": "b-zohowrite", "layer": "bridge", "label": "zoho write allow-list", "sub": "deny-by-default", "purpose": "zohoFetch refuses any non-GET not on this list before the request leaves the process. Exactly three writes today: create a deal, move a deal's stage, attach a file to a deal. The OAuth scope string is NOT what limits this app — this is.", "files": ["lib/zoho/write-allowlist.ts"]}, {"id": "x-pbs", "layer": "external", "label": "PBS billing", "sub": "pbsserver.com/api", "purpose": "The billing system. Machine-to-machine JWT, credentials in the JSON body (Bearer is rejected); success is the parsed `status` field, never the HTTP status. CREATE-ONLY for purchase orders: there is no update and no delete endpoint, so a wrong PO is a manual cleanup and a changed schedule can only be REPORTED as drift.", "files": ["lib/pbs/endpoints.ts", "docs/pbs-integration-plan.md"]}, {"id": "b-pbstokens", "layer": "bridge", "label": "PBS token cache", "sub": "server-only · mintOnce", "purpose": "Mints + caches the 1-hour access token in pbs_connection. /refresh is never called (rotation kills the old token instantly). Minting is NOT safe to race — PBS has a unique index on (app_id, refresh_token_hash) — so every caller shares one in-flight promise and re-reads the cache on failure.", "files": ["lib/pbs/tokens.ts"]}, {"id": "api-pbs", "layer": "bridge", "label": "/api/pbs/*", "sub": "health · clients · pos", "purpose": "GET /api/pbs/health (admin). GET /api/pbs/clients (derived from PO history — PBS has no clients endpoint). GET /api/pbs/pos (candidate preview + linked-PO status refresh). POST /api/pbs/pos is the only write: gated on the Zoho deal being won, re-read LIVE and failing closed, refusing a quote that already has a po_no and claiming the row with a 2-min compare-and-set first.", "files": ["app/api/pbs/pos/route.ts", "lib/pbs/clients.ts", "lib/pbs/directory.ts"], "flags": {"gated": "admin/manager; health admin-only"}}, {"id": "t-pbsconn", "layer": "data", "label": "pbs_connection", "sub": "0030 · RLS, NO policies", "purpose": "Singleton token cache. RLS enabled with no policies at all, like zoho_connection — anon/authenticated cannot touch it; only the service-role server routes can. It is a cache, not a source of truth.", "files": ["supabase/migrations/0030_pbs_connection.sql"]}, {"id": "l-workload", "layer": "bridge", "label": "assigned-work", "sub": "one definition, both views", "purpose": "assignedWork() / capacityFor() / utilization() — what one person is carrying and how much room they have. Open = status !== 'done' (in_review and blocked still count). Allocated = accepted + pending; rejected/passed never appear because respondToAssignment DELETES the task_assignees row. Capacity is contracted hours minus this week's time off. Backs BOTH the Mine and Team tabs, which previously each rolled their own and disagreed about the same person in the same week.", "files": ["lib/workload/assigned-work.ts", "e2e/workload-assigned-work.spec.ts"]}, {"id": "l-ptoimpact", "layer": "bridge", "label": "pto-impact", "sub": "pure · preview→confirm", "purpose": "ptoImpact() lists the tasks an absence lands on (due date inside the range), whether anyone else is accepted on them, suggested cover via the assignment engine's own skillTiers, and any sprint that can no longer finish. reschedulePatches() returns the exact writes an 'Approve + reschedule' makes — applied from the rendered object, never recomputed at write time.", "files": ["lib/availability/pto-impact.ts", "e2e/pto-impact.spec.ts"]}, {"id": "c-ptoapproval", "layer": "surfaces", "label": "Time-off approval", "sub": "Settings · admin+manager", "purpose": "The pending queue and the review dialog. Shows the impact before the decision, then Approve only / Approve + reschedule / Decline, with a note the requester sees.", "files": ["components/features/settings/TimeOffApprovalDialog.tsx", "components/features/settings/AdminTeamTimeOffSection.tsx"], "flags": {"gated": "admin/manager (canApproveTimeOff)"}}, {"id": "l-teamcal", "layer": "bridge", "label": "team-calendar", "sub": "pure · PTO → timeline", "purpose": "buildTeamCalendar() turns the roster + APPROVED time off into a per-day availability factor; addWorkingDays() replaces addBusinessDays wherever the tentative timeline converts a business-day offset to a date. Optional everywhere — with no calendar it delegates to addBusinessDays, so a workspace with no leave is byte-identical. totalBusinessDays never changes: leave moves WHEN work lands, not how much there is.", "files": ["lib/discovery/team-calendar.ts", "hooks/useTeamCalendar.ts", "e2e/team-calendar.spec.ts"]}, {"id": "l-holidays", "layer": "bridge", "label": "us-holidays", "sub": "pure · 4 consumers", "purpose": "The eleven US federal holidays with the 5 U.S.C. 6103 observance rule (Saturday -> the Friday before, Sunday -> the Monday after). Read by the timeline walk, weekly capacity, the assignment planner and the PTO impact preview, so none of them can disagree about whether work happens on Christmas. New Year's Day can be observed in the PREVIOUS December, so range lookups scan a year either side.", "files": ["lib/calendar/us-holidays.ts", "e2e/us-holidays.spec.ts"]}, {"id": "c-riskbuffer", "layer": "surfaces", "label": "Risk buffer", "sub": "Estimator Adjust + project page", "purpose": "Schedule contingency 0-100%, on proposals and projects (0036). One shared card. On an estimate it stretches the tentative timeline and the sprints Start project scaffolds; on a project it is a forecast until explicitly applied, which rewrites sprint dates behind a preview and resets the buffer to 0 so it cannot compound. Never touches hours or price - that is requirements_unclear.", "files": ["components/features/proposals/RiskBufferCard.tsx", "components/features/sprints/ProjectRiskBufferSection.tsx", "e2e/risk-buffer.spec.ts"], "flags": {"gated": "admin/manager"}}, {"id": "c-workloadbar", "layer": "surfaces", "label": "WorkloadBar", "sub": "shared · status-coloured", "purpose": "The load bar on both workload views, segmented by task status via statusBreakdown(). A single-colour bar could only say full; full of unstarted work, work in flight and BLOCKED work are three different problems. Over capacity is an amber ring, not a recolour, so the limit and the composition stay separate signals. Colours come from lib/constants/task-status.ts.", "files": ["components/features/workload/WorkloadBar.tsx", "lib/constants/task-status.ts"]}, {"id": "c-taskbadge", "layer": "surfaces", "label": "TaskBadgePopover", "sub": "pending / overdue", "purpose": "Count badges on the workload cards that open the list of tasks behind them, each row linking to its board. A button+popover, not a hover tooltip - hover does not exist on a phone and this is a control. Shared by both workload views; assignedWork returns overdueTasks so the badge and its list cannot disagree.", "files": ["components/features/workload/TaskBadgePopover.tsx", "e2e/workload-badges.spec.ts"]}, {"id": "t-hourly-rates", "layer": "data", "label": "hourly_rates", "sub": "0042", "purpose": "Rate per (responsible, level), seeded from the pricing workbook. RLS: admin+manager read, admin write. updated_by/updated_at stamped by trigger. Realtime. Not yet used for pricing (Phase 3 snapshots it onto lines).", "files": ["supabase/migrations/0042_hourly_rates.sql"]}, {"id": "st-hourly-rates", "layer": "state", "label": "hourly-rates-store", "sub": "live + demo", "purpose": "Hydrates hourly_rates (empty for members by RLS); realtime appliers keyed (responsible, level); saveRates = one optimistic upsert with rollback. Rules in lib/pricing/hourly-rates.ts.", "files": ["store/hourly-rates-store.ts", "lib/pricing/hourly-rates.ts", "components/features/settings/HourlyRatesCard.tsx"]}, {"id": "c-tours", "layer": "surfaces", "label": "Onboarding tours", "sub": "? menu · welcome · nudges", "purpose": "Per-page guided tours on driver.js, started from the header's ? button (HelpMenu). TourHost (dashboard layout) shows the welcome dialog once to newcomers on /dashboard, a one-time hint to existing users, one nudge per page tour to newcomers (never an auto-start), runs checklist 'Show me' hand-offs, and ends a tour on navigation. Tours are READ-ONLY: driver.js disableActiveInteraction blocks the highlighted control and page keyboard shortcuts are swallowed while one runs.", "files": ["components/features/tour/HelpMenu.tsx", "components/features/tour/TourHost.tsx", "components/features/tour/use-tours.ts", "lib/tours/tours.ts", "lib/tours/run.ts", "lib/tours/ids.ts", "app/globals.css"], "notes": "Steps anchor on data-tour ids (lib/tours/ids.ts, typed); a step whose target is not visible, or that the role can't act on (usePermissions flags), is skipped. Phones (<md) dock the popover as a sheet away from the highlighted element.", "flags": ["read-only"]}, {"id": "c-checklist", "layer": "surfaces", "label": "Getting started checklist", "sub": "Dashboard (Mine)", "purpose": "Per-role first steps whose completion is DERIVED from real data (avatar, own weekly_capacity row, accepted assignments, time_entries, owned project/estimate, team size, Zoho status) — never stored, never ticked by hand. Only its dismissal is stored. Show me navigates and starts the right tour at the right step.", "files": ["components/features/tour/GettingStartedCard.tsx", "lib/tours/checklist.ts"]}, {"id": "st-tours", "layer": "state", "label": "tour-store", "sub": "timeline-tours", "purpose": "Which tours each person has seen (tour id -> version/status), keyed by user id. Hydrated by WorkspaceSync; upserts tour_progress. A failed write is deliberately NOT rolled back (local copy kept, so nobody is re-nagged). Session-only: active tour, pending Show me, welcome deferred, checklist reopened.", "files": ["store/tour-store.ts"]}, {"id": "t-tour-progress", "layer": "data", "label": "tour_progress", "sub": "0045", "purpose": "(profile_id, tour_id) -> version, status completed|dismissed, updated_at (trigger-stamped). RLS self-only for every operation (probe P17). Not on profiles and not published to realtime, on purpose: nobody else needs to know.", "files": ["supabase/migrations/0045_tour_progress.sql"]}], "edges": [{"from": "a-admin", "to": "s-team", "label": "manages team"}, {"from": "a-admin", "to": "s-login", "label": ""}, {"from": "a-manager", "to": "s-proposals", "label": "estimator"}, {"from": "a-manager", "to": "s-projects", "label": ""}, {"from": "a-member", "to": "s-board", "label": "does work"}, {"from": "a-viewer", "to": "s-dashboard", "label": "read-only"}, {"from": "a-invitee", "to": "s-authconfirm", "label": "confirms invite"}, {"from": "s-dashboard", "to": "st-auth", "label": ""}, {"from": "s-dashboard", "to": "st-projects", "label": ""}, {"from": "s-dashboard", "to": "st-sprints", "label": ""}, {"from": "s-dashboard", "to": "st-tasks", "label": ""}, {"from": "s-dashboard", "to": "st-activity", "label": ""}, {"from": "s-projects", "to": "st-projects", "label": ""}, {"from": "s-projects", "to": "h-permissions", "label": ""}, {"from"
